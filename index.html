<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les MiniNous — Vos personnages, taillés dans le bois.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="/images/v1.svg" type="image/svg+xml">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
<style>
:root {
  --clay:#C0684A; --clay-light:#E8A088; --clay-pale:#FAF0EB; --clay-deep:#8A4030;
  --bark:#7A5C38; --bark-light:#C4A882; --bark-pale:#F5EDE0;
  --forest:#4A8A52; --forest-light:#A8D4AC; --forest-pale:#EBF4EC;
  --cream:#FAF7F2; --dark:#2C1F14; --text:#3D3530; --muted:#9A8F88;
  --t:.32s cubic-bezier(.4,0,.2,1);
  --t-spring:.48s cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden}
h1,h2,h3,h4{font-family:'Quicksand',sans-serif;font-weight:700;line-height:1.15}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input{font-family:inherit}

/* Screens */
.screen{min-height:100vh;animation:screenIn .5s cubic-bezier(.4,0,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* Nav */
.nav-glass{background:rgba(250,247,242,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(196,168,130,.2)}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* Buttons */
.btn-clay{background:linear-gradient(135deg,var(--clay) 0%,#A85238 100%);color:#fff;border-radius:100px;font-family:'Quicksand',sans-serif;font-weight:700;transition:all var(--t-spring);box-shadow:0 8px 24px rgba(192,104,74,.38)}
.btn-clay:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 36px rgba(192,104,74,.52)}
.btn-clay:active{transform:scale(.97)}
.btn-bark{background:linear-gradient(135deg,var(--bark) 0%,#5A4228 100%);color:#fff;border-radius:100px;font-family:'Quicksand',sans-serif;font-weight:700;transition:all var(--t);box-shadow:0 6px 18px rgba(122,92,56,.32)}
.btn-bark:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(122,92,56,.45)}
.btn-ghost{border:2px solid var(--bark-light);color:var(--bark);border-radius:100px;font-family:'Quicksand',sans-serif;font-weight:700;transition:all var(--t)}
.btn-ghost:hover{background:var(--bark-pale);border-color:var(--bark)}

/* Before/After */
.ba-wrap{position:relative;overflow:hidden;border-radius:20px;cursor:ew-resize;user-select:none;touch-action:none}
.ba-after{position:absolute;inset:0;overflow:hidden}
.ba-handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;transform:translateX(-50%);z-index:10;pointer-events:none}
.ba-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;pointer-events:none;left:50%;transform:translate(-50%,-50%)}

/* Dropzone */
.dropzone{border:3px dashed var(--bark-light);transition:all .3s ease;background:linear-gradient(135deg,var(--bark-pale) 0%,var(--cream) 100%);border-radius:28px}
.dropzone.drag-over,.dropzone:hover{border-color:var(--clay);background:linear-gradient(135deg,var(--clay-pale) 0%,var(--cream) 100%);transform:scale(1.01)}

/* Bounding boxes */
.bbox{position:absolute;border:2.5px solid #00FF88;border-radius:4px;box-shadow:0 0 14px rgba(0,255,136,.5),inset 0 0 14px rgba(0,255,136,.05);animation:bboxIn .35s ease-out both;pointer-events:none}
.bbox-label{position:absolute;top:-22px;left:0;background:#00FF88;color:#001A0A;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap}
@keyframes bboxIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#00FF88 40%,#00FF88 60%,transparent);box-shadow:0 0 20px #00FF88;animation:scan 2s linear infinite;pointer-events:none}
@keyframes scan{from{top:0}to{top:100%}}

/* Progress */
.prog-fill{height:100%;background:linear-gradient(90deg,var(--clay),var(--bark-light));border-radius:100px;transition:width .5s ease;position:relative;overflow:hidden}
.prog-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* Toggle */
.tgl-track{width:52px;height:28px;border-radius:100px;transition:background .3s;cursor:pointer;position:relative;flex-shrink:0}
.tgl-thumb{position:absolute;top:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22);transition:left var(--t-spring)}

/* Figurine card */
.fig-card{transition:all var(--t-spring);cursor:pointer;text-align:center;position:relative}
.fig-card:hover{transform:translateY(-10px) scale(1.06)}
.fig-card.active{transform:translateY(-10px) scale(1.06)}
.fig-ring{position:absolute;inset:-10px;border-radius:18px;border:2px solid var(--clay);box-shadow:0 0 24px rgba(192,104,74,.45);pointer-events:none;animation:screenIn .3s ease}

/* Side panel */
.side-panel{border-left:1px solid rgba(255,255,255,.08);animation:panelIn .4s var(--t-spring) both}
@keyframes panelIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}

/* Stripe modal */
.modal-overlay{position:fixed;inset:0;background:rgba(44,31,20,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;animation:screenIn .3s ease}

/* Timeline */
.tl-item{animation:tlIn .5s ease both}
@keyframes tlIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}

/* Pulse */
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}

/* Spin */
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spin{animation:spin .75s linear infinite}

/* Review stars */
.stars{color:#F5C518;letter-spacing:2px}

/* Responsive */
@media(max-width:768px){
  .two-col{grid-template-columns:1fr !important}
  .hero-grid{grid-template-columns:1fr !important; gap:24px !important; padding:28px 20px 40px !important}
  .hero-img{order:-1}
  .hero-text{order:1}
  .hide-mobile{display:none !important}
  .how-cards{grid-template-columns:1fr !important; gap:12px !important}
  .how-card{display:flex !important; align-items:center; gap:16px; text-align:left !important; padding:16px 18px !important}
  .how-card p{margin:0}
}

/* FOMO + packs */
.fomo-bar{position:sticky;top:0;z-index:60;background:linear-gradient(90deg,var(--dark) 0%,#3d2a1c 100%);color:#fff;padding:10px 20px;text-align:center;font-size:.82rem;font-weight:600;letter-spacing:.02em;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.fomo-bar strong{color:#FCD34D}
.fomo-countdown{font-variant-numeric:tabular-nums;margin-left:8px;color:var(--clay-light)}
.pack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}
@media(max-width:768px){.pack-grid{grid-template-columns:1fr}}
.pack-card{background:#fff;border-radius:20px;padding:28px 24px;border:2px solid var(--bark-pale);transition:all var(--t);text-align:left;display:flex;flex-direction:column;gap:12px}
.pack-card:hover{border-color:var(--clay);box-shadow:0 12px 40px rgba(192,104,74,.15);transform:translateY(-4px)}
.pack-card.featured{border-color:var(--clay);box-shadow:0 16px 48px rgba(192,104,74,.2)}
.pack-photo{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--bark-pale);margin-bottom:4px}
.pack-photo img{width:100%;height:100%;object-fit:cover;display:block}
.pack-price{font-family:Quicksand,sans-serif;font-size:1.75rem;font-weight:700;color:var(--dark);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.pack-price small{font-size:.85rem;font-weight:500;color:var(--muted)}
.pack-price .pack-shipping{font-size:.72rem;font-weight:500;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
const { useState, useEffect, useRef, useCallback } = React;

async function checkoutPack(packId, faceCount) {
  const res = await fetch('/api/checkout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pack: packId, faceCount }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erreur paiement');
  window.location.href = data.url;
}

const EXTRA_PERSON_EUR = 4.5;
const MAX_FACES = 8;

function computeDynamicQuote(faceCount, packs, extraPersonEur = EXTRA_PERSON_EUR) {
  const n = Number(faceCount);
  if (!Number.isFinite(n) || n < 1) return { ok: false, reason: 'invalid' };
  if (n > MAX_FACES) return { ok: false, reason: 'too_many', faceCount: n, maxFaces: MAX_FACES };

  const list = packs?.length ? packs : DEFAULT_PACKS;
  const sorted = [...list].sort((a, b) => a.faceCount - b.faceCount);
  let basePack = sorted[0];
  for (const p of sorted) {
    if (p.faceCount <= n) basePack = p;
  }
  const extraCount = Math.max(0, n - basePack.faceCount);
  const basePrice = Number(basePack.priceEur);
  const shipping = Number(basePack.shippingEur) || 0;
  const extraTotal = extraCount * Number(extraPersonEur);
  const total = basePrice + extraTotal + shipping;

  return {
    ok: true,
    faceCount: n,
    basePack,
    extraCount,
    extraPersonEur: Number(extraPersonEur).toFixed(2),
    basePriceEur: basePrice.toFixed(2),
    shippingEur: shipping.toFixed(2),
    totalEur: total.toFixed(2),
    label: extraCount > 0 ? `${basePack.label} + ${extraCount} pers.` : basePack.label,
  };
}

function useWeekStatus() {
  const [status, setStatus] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    fetch('/api/week-status')
      .then(r => r.json())
      .then(setStatus)
      .catch(e => setErr(e.message));
  }, []);
  return { status, err };
}

function FomoBar() {
  const { status } = useWeekStatus();
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const cutoff = status?.cutoffAt ? new Date(status.cutoffAt).getTime() : null;
  const remaining = status?.displayRemaining ?? status?.remaining ?? '…';
  const capacity = status?.capacity ?? 100;

  let countdown = '—';
  if (cutoff) {
    const diff = Math.max(0, cutoff - now);
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    countdown = `${h}h${String(m).padStart(2,'0')}m${String(s).padStart(2,'0')}s`;
  }

  return (
    <div className="fomo-bar">
      Fabrication sur-mesure - Production tous les mardis 10H
      {' - '}
      <span className="fomo-countdown">{countdown}</span>
      {' · '}
      <strong>{remaining} / {capacity}</strong> places restantes
    </div>
  );
}

const DEFAULT_PACKS = [
  { id:'duo', label:'Pack Duo', faceCount:2, priceEur:'19.90', shippingEur:'7.00', totalEur:'26.90' },
  { id:'famille', label:'Pack Famille', faceCount:4, priceEur:'29.90', shippingEur:'0.00', totalEur:'29.90' },
  { id:'grande_famille', label:'Pack Grande Famille', faceCount:8, priceEur:'44.90', shippingEur:'0.00', totalEur:'44.90' },
];

const PACK_LINEARTS = {
  duo:            'images/duo-lineart.jpg',
  famille:        'images/famille4-lineart.jpg',
  grande_famille: 'images/famille7-lineart.png',
};

const PACK_PREVIEWS = {
  duo:            'images/duo.jpg',
  famille:        'images/famille4.jpg',
  grande_famille: 'images/famille7.jpg',
};

function PackPhoto({ packId }) {
  const src = PACK_LINEARTS[packId];
  if (!src) return null;
  return (
    <div className="pack-photo">
      <img src={src} alt="" draggable="false"/>
    </div>
  );
}

function getPackDef(packId, packs) {
  const list = packs?.length ? packs : DEFAULT_PACKS;
  const base = list.find(p => p.id === packId) || list[0];
  return { ...base, preview: PACK_PREVIEWS[base.id] || 'images/apres-ref.png' };
}

/** Pack catalogue le plus adapté au nombre de visages détectés. */
function packIdForFaceCount(faceCount) {
  const n = Number(faceCount);
  if (!n || n < 1) return 'famille';
  if (n <= 2) return 'duo';
  if (n <= 4) return 'famille';
  return 'grande_famille';
}

const PACK_CTA = {
  duo: 'Voir l\'exemple Duo →',
  famille: 'Voir l\'exemple Famille →',
  grande_famille: 'Voir l\'exemple Grande Famille →',
};

function PackCards({ onPackExample }) {
  const { status } = useWeekStatus();

  const packs = status?.packs ?? DEFAULT_PACKS;
  const soldOut = status && status.remaining <= 0;

  return (
    <div id="packs">
      <div style={{ maxWidth:960, margin:'0 auto', textAlign:'center' }}>
        <p style={{ color:'var(--muted)', marginBottom:8, lineHeight:1.7, fontSize:'.95rem' }}>
          Fabrication artisanale sur-mesure · Réception vendredi chez vous · Places limitées
        </p>
        <p style={{ color:'var(--clay-deep)', marginBottom:24, lineHeight:1.65, fontSize:'.82rem',
          maxWidth:560, marginLeft:'auto', marginRight:'auto' }}>
          Les visuels ci-dessous sont des <strong>exemples du rendu atelier</strong> (figurines bois sur établi) —
          pas votre photo. Uploadez la vôtre pour voir votre groupe en figurines bois.
        </p>
        <div className="pack-grid">
          {packs.map((p, i) => (
            <div key={p.id} className={`pack-card${i === 1 ? ' featured' : ''}`}>
              {i === 1 && (
                <span className="tag" style={{ background:'var(--clay-pale)', color:'var(--clay)', alignSelf:'flex-start' }}>
                  Le plus populaire
                </span>
              )}
              <h3 style={{ fontFamily:'Quicksand', color:'var(--dark)', fontSize:'1.15rem' }}>{p.label}</h3>
              <PackPhoto packId={p.id} />
              <p style={{ fontSize:'.85rem', color:'var(--muted)' }}>
                {p.faceCount} personnage{p.faceCount > 1 ? 's' : ''}
              </p>
              <div className="pack-price">
                {(p.priceEur ?? p.totalEur)} € <small>TTC</small>
                {Number(p.shippingEur) > 0 ? (
                  <span className="pack-shipping">+ {Number(p.shippingEur).toFixed(0)} € de port</span>
                ) : (
                  <span className="pack-shipping">🎁 port offert</span>
                )}
              </div>
              <button className="btn-clay" style={{ width:'100%', padding:'14px', marginTop:'auto', opacity: soldOut ? .5 : 1 }}
                disabled={soldOut}
                onClick={() => onPackExample?.(p.id)}>
                {soldOut ? 'Complet cette semaine' : (PACK_CTA[p.id] || 'Essayer avec ma photo')}
              </button>
            </div>
          ))}
        </div>
        <p style={{ fontSize:'.72rem', color:'var(--muted)', marginTop:16 }}>
          Aperçu gratuit · Paiement après validation de votre rendu
        </p>
      </div>
    </div>
  );
}

/* ─── ASSETS ──────────────────────────────────────────────────── */
const IMG = {
  hero:      'images/hero.webp',
  before:    'images/famille4.jpg',
  after:     'images/famille4-lineart.jpg',
  upload:    'images/famille7.jpg',
  lifestyle: 'images/af5dfcad-37bc-4917-99fd-c47c7d53d8a2.jpg',
  atelier:   'images/apres-ref.png',
  refFal:    'images/apres-ref.png',
};

/* Face boxes on the "before" photo — 7 people */
const FACES = [
  { top:'14%', left:'3.5%',  w:'12%', h:'24%', delay:.3,  name:'Thomas' },
  { top:'14%', left:'17%',   w:'12%', h:'24%', delay:.65, name:'Léa' },
  { top:'14%', left:'31%',   w:'12%', h:'24%', delay:.95, name:'Mamie' },
  { top:'40%', left:'42%',   w:'9%',  h:'17%', delay:1.2, name:'Loulou' },
  { top:'14%', left:'47%',   w:'12%', h:'24%', delay:1.45,name:'Théo' },
  { top:'14%', left:'63%',   w:'12%', h:'24%', delay:1.7, name:'Sophie' },
  { top:'14%', left:'79%',   w:'12%', h:'24%', delay:1.95,name:'Emma' },
];

const PEOPLE = [
  { id:0, name:'Thomas', h:118, style:'man'   },
  { id:1, name:'Léa',    h:108, style:'teen'  },
  { id:2, name:'Mamie',  h:105, style:'elder' },
  { id:3, name:'Loulou', h:64,  style:'baby'  },
  { id:4, name:'Théo',   h:114, style:'teen'  },
  { id:5, name:'Sophie', h:110, style:'woman' },
  { id:6, name:'Emma',   h:104, style:'woman' },
];

const PROC_STEPS = [
  'On regarde votre photo de près…',
  'On repère chaque personnage (7 trouvés)…',
  'On dessine les contours de chaque personnage…',
  'On prépare les gabarits sur mesure…',
  'On vérifie les proportions de chacun…',
  'Dernière touche avant de vous montrer ça…',
  'Voici votre groupe !',
];

/* ─── SVG FIGURINE ────────────────────────────────────────────── */
function Figurine({ person, scale = 1, selected, regen }) {
  const h = person.h * scale;
  const w = h * 0.56;
  const cx = w / 2;
  const hr = h * 0.125; // head radius
  const bodyY = hr * 2 + 3;
  const bodyH = h * 0.34;
  const legH = h * 0.27;
  const isBaby = person.style === 'baby';
  const isElder = person.style === 'elder';

  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none"
      style={{
        filter: selected
          ? 'drop-shadow(0 0 14px rgba(192,104,74,.65))'
          : 'drop-shadow(0 3px 8px rgba(122,92,56,.22))',
        opacity: regen ? 0.25 : 1,
        transition: 'opacity .3s, filter .3s',
        ...(regen ? { filter:'blur(3px)' } : {}),
      }}>
      {/* Head */}
      <circle cx={cx} cy={hr + 1} r={hr} stroke="#7A5C38" strokeWidth="2.2" fill="#F5EDE0"/>
      {/* Hair suggestion */}
      {(person.style === 'woman' || person.style === 'elder') && (
        <path d={`M${cx - hr * .8} ${hr * .6} Q${cx} ${-2} ${cx + hr * .8} ${hr * .6}`}
          stroke="#7A5C38" strokeWidth="1.8" fill="none" strokeLinecap="round"/>
      )}
      {isElder && (
        <path d={`M${cx - hr * .5} ${hr * .3} Q${cx} ${-4} ${cx + hr * .5} ${hr * .3}`}
          stroke="#C4A882" strokeWidth="1.2" fill="none" strokeLinecap="round" strokeDasharray="2 2"/>
      )}
      {/* Neck */}
      <line x1={cx} y1={hr * 2 + 1} x2={cx} y2={bodyY} stroke="#7A5C38" strokeWidth="1.8"/>
      {/* Body */}
      <rect x={cx - w * .21} y={bodyY} width={w * .42} height={bodyH}
        rx={isBaby ? 8 : 5} stroke="#7A5C38" strokeWidth="2.2" fill="#F5EDE0"/>
      {/* Pocket detail for men */}
      {person.style === 'man' && (
        <rect x={cx + w * .04} y={bodyY + bodyH * .15} width={w * .1} height={w * .1}
          rx="2" stroke="#7A5C38" strokeWidth="1.2" fill="none"/>
      )}
      {/* Arms */}
      <line x1={cx - w * .21} y1={bodyY + bodyH * .18}
            x2={cx - w * .43} y2={bodyY + bodyH * .58}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      <line x1={cx + w * .21} y1={bodyY + bodyH * .18}
            x2={cx + w * .43} y2={bodyY + bodyH * .58}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      {/* Hands */}
      <circle cx={cx - w * .43} cy={bodyY + bodyH * .6} r={w * .045}
        stroke="#7A5C38" strokeWidth="1.6" fill="#F5EDE0"/>
      <circle cx={cx + w * .43} cy={bodyY + bodyH * .6} r={w * .045}
        stroke="#7A5C38" strokeWidth="1.6" fill="#F5EDE0"/>
      {/* Legs */}
      <line x1={cx - w * .1} y1={bodyY + bodyH}
            x2={cx - w * .14} y2={bodyY + bodyH + legH}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      <line x1={cx + w * .1} y1={bodyY + bodyH}
            x2={cx + w * .14} y2={bodyY + bodyH + legH}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      {/* Feet */}
      <line x1={cx - w * .14} y1={bodyY + bodyH + legH}
            x2={cx - w * .3}  y2={bodyY + bodyH + legH}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      <line x1={cx + w * .14} y1={bodyY + bodyH + legH}
            x2={cx + w * .3}  y2={bodyY + bodyH + legH}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      {/* Base */}
      <rect x={cx - w * .44} y={h - 9} width={w * .88} height={7}
        rx="3" fill="#C4A882" stroke="#7A5C38" strokeWidth="1.5"/>
    </svg>
  );
}

/* ─── BEFORE / AFTER SLIDER ───────────────────────────────────── */
function BeforeAfter() {
  const [pos, setPos] = useState(50);
  const dragging = useRef(false);
  const ref = useRef(null);

  const move = useCallback((cx) => {
    if (!dragging.current || !ref.current) return;
    const r = ref.current.getBoundingClientRect();
    setPos(Math.max(4, Math.min(96, ((cx - r.left) / r.width) * 100)));
  }, []);

  useEffect(() => {
    const mm = e => move(e.clientX);
    const tm = e => move(e.touches[0].clientX);
    const up = () => { dragging.current = false; };
    window.addEventListener('mousemove', mm);
    window.addEventListener('touchmove', tm, { passive: true });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
    return () => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('touchmove', tm);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchend', up);
    };
  }, [move]);

  return (
    <div ref={ref} className="ba-wrap" style={{ aspectRatio:'4/3', maxHeight:460, maxWidth:720, margin:'0 auto' }}
      onMouseDown={() => { dragging.current = true; }}
      onTouchStart={() => { dragging.current = true; }}
      onDragStart={e => e.preventDefault()}>
      {/* Before */}
      <img src={IMG.before} alt="Photo originale" draggable="false"
        style={{ width:'100%', height:'100%', objectFit:'cover', pointerEvents:'none' }}/>
      {/* After */}

        <img src={IMG.after} alt="Résultat" draggable="false"
          style={{ width:'100%', height:'100%', objectFit:'cover', background:'#F5EDE0', pointerEvents:'none' }}/>

/* ─── DÉTECTION VISAGES (face-api.js) ─────────────────────────── */
let faceApiReady = false;
async function loadFaceApi() {
  if (faceApiReady) return;
  await new Promise((resolve, reject) => {
    if (window.faceapi) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  const tf = window.faceapi.tf;
  try {
    await tf.setBackend('cpu');
    await tf.ready();
  } catch {
    /* WebGL indisponible — CPU déjà actif ou fallback silencieux */
  }
  const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
  await window.faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  faceApiReady = true;
}

async function detectFaceCount(dataUrl) {
  try {
    await loadFaceApi();
    const img = new Image();
    img.src = dataUrl;
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
    const detections = await window.faceapi.detectAllFaces(
      img,
      new window.faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.32 }),
    );
    return detections.length;
  } catch (err) {
    console.warn('[face-api] détection impossible:', err?.message || err);
    return 0;
  }
}

function isImageFile(file) {
  return file && (
    file.type?.startsWith('image/')
    || /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(file.name || '')
  );
}

function readImageFile(file) {
  return new Promise((resolve, reject) => {
    const photoUrl = URL.createObjectURL(file);
    const reader = new FileReader();
    reader.onload = () => resolve({ photoUrl, photoBase64: reader.result });
    reader.onerror = () => { URL.revokeObjectURL(photoUrl); reject(new Error('Lecture impossible')); };
    reader.readAsDataURL(file);
  });
}

/* ─── APERÇU FILIGRANÉ ────────────────────────────────────────── */
function WatermarkedPreview({ src, alt, style = {} }) {
  const [displaySrc, setDisplaySrc] = useState(null);
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    if (!src) { setDisplaySrc(null); return undefined; }
    let cancelled = false;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (cancelled) return;
      const maxW = 480;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      ctx.save();
      ctx.globalAlpha = 0.32;
      ctx.fillStyle = '#2C1F14';
      const fontSize = Math.max(14, Math.round(w / 14));
      ctx.font = `700 ${fontSize}px Quicksand, Montserrat, sans-serif`;
      const stepY = fontSize * 2.6;
      const stepX = fontSize * 6.2;
      ctx.translate(w / 2, h / 2);
      ctx.rotate(-24 * Math.PI / 180);
      for (let y = -h; y < h * 2; y += stepY) {
        for (let x = -w; x < w * 2; x += stepX) {
          ctx.fillText('MiniNous', x, y);
        }
      }
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#2C1F14';
      const big = Math.max(28, Math.round(w / 5.5));
      ctx.font = `800 ${big}px Quicksand, Montserrat, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.translate(w / 2, h / 2);
      ctx.rotate(-18 * Math.PI / 180);
      ctx.fillText('APERÇU', 0, 0);
      ctx.restore();
      setDisplaySrc(canvas.toDataURL('image/jpeg', 0.58));
      setFailed(false);
    };
    img.onerror = () => {
      if (!cancelled) { setFailed(true); setDisplaySrc(src); }
    };
    const loadUrl = (src.startsWith('http://') || src.startsWith('https://'))
      ? `/api/proxy-image?url=${encodeURIComponent(src)}`
      : src;
    img.src = loadUrl;
    return () => { cancelled = true; };
  }, [src]);

  if (!src) return null;
  if (!displaySrc && !failed) {
    return (
      <div style={{ ...style, minHeight: 220, display:'flex', alignItems:'center',
        justifyContent:'center', background:'var(--bark-pale)', borderRadius:20 }}>
        <span className="spin" style={{ width:32, height:32, border:'3px solid var(--bark-light)',
          borderTopColor:'var(--clay)', borderRadius:'50%', display:'inline-block' }}/>
      </div>
    );
  }
  return (
    <img src={displaySrc || src} alt={alt} style={style} draggable="false"/>
  );
}

          </p>
        </>}

        {phase === 'paying' && (
          <div style={{ textAlign:'center', padding:'20px 0' }}>
            <div className="spin" style={{ width:56, height:56, border:'4px solid #EEE',
              borderTop:'4px solid var(--clay)', borderRadius:'50%', margin:'0 auto 20px' }}/>
            <p style={{ fontFamily:'Quicksand', fontWeight:600, color:'var(--dark)',
              fontSize:'1rem' }}>Validation en cours…</p>
          </div>
        )}

        {phase === 'done' && (
          <div style={{ textAlign:'center', padding:'20px 0' }}>
            <div style={{ width:60, height:60, background:'var(--forest)', borderRadius:'50%',
              display:'flex', alignItems:'center', justifyContent:'center',
              margin:'0 auto 18px' }}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <path d="M5 12l5 5L19 7" stroke="#fff" strokeWidth="2.8"
                  strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <p style={{ fontFamily:'Quicksand', fontWeight:700, fontSize:'1.1rem',
              color:'var(--dark)', marginBottom:6 }}>Paiement validé !</p>
            <p style={{ color:'var(--muted)', fontSize:'.85rem' }}>Ouverture de l'éditeur…</p>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── CONFIRMATION NOMBRE DE PERSONNAGES ─────────────────────────── */
function PersonCountQuestion({ count, detected, max, onChange, photoUrl }) {
  const n = Number(count) || 2;
  const set = (next) => onChange(Math.max(1, Math.min(max, next)));

  return (
    <div style={{ padding:'14px 16px', background:'#fff', border:'1.5px solid var(--bark-light)',
      borderRadius:14, textAlign:'left' }}>
      <div style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
        {photoUrl && (
          <img src={photoUrl} alt="Votre photo" style={{
            width:80, height:60, objectFit:'cover', borderRadius:8,
            border:'2px solid var(--bark-light)', flexShrink:0,
          }}/>
        )}
        <div style={{ flex:1, minWidth:0 }}>
          <p style={{ fontFamily:'Quicksand', fontWeight:600, fontSize:'.92rem',
            color:'var(--dark)', lineHeight:1.55, marginBottom:12 }}>
            Il y a bien{' '}
            <span style={{ color:'var(--clay)' }}>{n} personne{n > 1 ? 's' : ''}</span>
            {' '}sur votre photo&nbsp;?
          </p>
          <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
            <button type="button" aria-label="Moins une personne"
              onClick={() => set(n - 1)}
              disabled={n <= 1}
              style={{ width:36, height:36, borderRadius:9, border:'1.5px solid var(--bark-light)',
                background:'var(--bark-pale)', fontSize:'1.15rem', fontWeight:700, color:'var(--dark)',
                cursor: n <= 1 ? 'not-allowed' : 'pointer', opacity: n <= 1 ? .4 : 1 }}>
              −
            </button>
            <span style={{ fontFamily:'Quicksand', fontWeight:700, fontSize:'1.35rem',
              color:'var(--dark)', minWidth:28, textAlign:'center' }}>{n}</span>
            <button type="button" aria-label="Plus une personne"
              onClick={() => set(n + 1)}
              disabled={n >= max}
              style={{ width:36, height:36, borderRadius:9, border:'1.5px solid var(--bark-light)',
                background:'var(--bark-pale)', fontSize:'1.15rem', fontWeight:700, color:'var(--dark)',
                cursor: n >= max ? 'not-allowed' : 'pointer', opacity: n >= max ? .4 : 1 }}>
              +
            </button>
            <span style={{ fontSize:'.75rem', color:'var(--muted)', lineHeight:1.45 }}>
              Ajustez si ce n&apos;est pas le bon nombre
            </span>
          </div>
          {detected != null && detected !== n && (
            <p style={{ fontSize:'.75rem', color:'var(--clay)', marginTop:10, lineHeight:1.5 }}>
              Nous en avions repéré {detected} sur la photo — corrigez si besoin.
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─── STATE 3 · PAYWALL ───────────────────────────────────────── */
function Paywall({ packDef, status, session, packs, onPhotoUpload, onPreviewReady, onPreviewError, onFaceCountChange }) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const previewGenKey = useRef(null);
  const soldOut = status && status.remaining <= 0;
  const extraEur = Number(status?.extraPersonEur) || EXTRA_PERSON_EUR;

  const faceCountForQuote = session?.enterVia === 'upload'
    ? (session.faceCount ?? session.detectedFaces ?? 2)
    : packDef?.faceCount;
  const quote = computeDynamicQuote(faceCountForQuote, packs, extraEur);
  const tooManyFaces = !quote?.ok && quote?.reason === 'too_many';
  const hasQuote = quote?.ok;
  const showCountAdjuster = session?.enterVia === 'upload' && session?.photoBase64;

  const isExampleOnly = session?.enterVia === 'pack' && !session?.photoBase64;
  const hasAiPreview = !!session?.previewUrl;
  const previewFailed = session?.error && !session?.previewUrl;
  const previewLoading = !!session?.previewLoading && session?.photoBase64 && !hasAiPreview && !previewFailed && !tooManyFaces;
  const previewSrc = hasAiPreview ? session.previewUrl : packDef?.preview;

  useEffect(() => {
    const key = session?.photoBase64;
    const gen = session?.previewGen ?? 0;
    if (!key || session.enterVia !== 'upload' || tooManyFaces || !gen) return undefined;
    if (hasAiPreview && !session.previewLoading) return undefined;
    const token = `${gen}:${session.faceCount ?? 0}:${key.length}`;
    if (previewGenKey.current === token) return undefined;
    previewGenKey.current = token;

    let cancelled = false;
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    (async () => {
      try {
        const res = await fetch('/api/landing-preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            photoBase64: key,
            faceCount: session.faceCount ?? session.detectedFaces ?? null,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);

        const { requestId, model } = data;
        if (!requestId) throw new Error('Réponse API incomplète');

        const deadline = Date.now() + 180000;
        while (!cancelled && Date.now() < deadline) {
          await sleep(2000);
          const pollUrl = `/api/landing-preview?requestId=${encodeURIComponent(requestId)}&model=${encodeURIComponent(model || '')}`;
          const pollRes = await fetch(pollUrl);
          const poll = await pollRes.json().catch(() => ({}));
          if (!pollRes.ok) throw new Error(poll.error || `Erreur ${pollRes.status}`);

          if (poll.previewUrl) {
            if (!cancelled) onPreviewReady?.(poll.previewUrl);
            return;
          }
          if (poll.status === 'FAILED') {
            throw new Error(poll.error || 'Génération échouée');
          }
        }
        throw new Error('Délai dépassé — réessayez dans un instant');
      } catch (err) {
        if (!cancelled) onPreviewError?.(err?.message);
      }
    })();

    return () => { cancelled = true; };
  }, [
    session?.photoBase64, session?.enterVia, session?.faceCount, session?.detectedFaces,
    session?.previewGen, session?.previewLoading, tooManyFaces, hasAiPreview,
    onPreviewReady, onPreviewError,
  ]);

  const pay = async () => {
    if (!hasQuote || tooManyFaces) return;
    setBusy(true);
    setError(null);
    try {
      await checkoutPack(quote.basePack.id, quote.faceCount);
    } catch (e) {
      setError(e.message);
      setBusy(false);
    }
  };

  return (
    <div className="screen" style={{ background:'var(--cream)' }}>
      <nav className="nav-glass" style={{ position:'sticky', top:0, zIndex:50,
        padding:'14px 28px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div style={{ fontFamily:'Quicksand', fontWeight:700, fontSize:'1.25rem', color:'var(--dark)' }}>
          <span style={{ color:'var(--clay)' }}>Mini</span>Nous
        </div>
        <div className="tag" style={{ background: tooManyFaces ? 'var(--clay-pale)' : 'var(--forest-pale)',
          color: tooManyFaces ? 'var(--clay-deep)' : 'var(--forest)' }}>
          {tooManyFaces
            ? `⚠ ${faceCountForQuote} personnages — max ${MAX_FACES}`
            : hasQuote && showCountAdjuster
              ? `✓ ${quote.faceCount} pers. · ${quote.label}`
              : hasQuote && session?.detectedFaces
                ? `✓ ${session.detectedFaces} pers. · ${quote.label}`
                : `✓ ${packDef?.label} · exemple`}
        </div>
      </nav>

      <div className="two-col" style={{ maxWidth:1100, margin:'0 auto', padding:'44px 28px',
        display:'grid', gridTemplateColumns:'1fr 1fr', gap:48, alignItems:'start' }}>

        <div>
          <div className="tag" style={{
            background: isExampleOnly ? 'var(--bark-pale)' : 'var(--clay-pale)',
            color: isExampleOnly ? 'var(--bark)' : 'var(--clay)',
            marginBottom:18,
          }}>
            {isExampleOnly ? '📋 Exemple illustratif' : previewLoading ? '⏳ Préparation…' : '🎨 Aperçu atelier · filigrané'}
          </div>
          <h2 style={{ color:'var(--dark)', marginBottom:14 }}>
            {hasAiPreview ? 'Vos figurines dans l\'atelier' : 'Exemple · figurines bois atelier'}
          </h2>

          {tooManyFaces && (
            <div style={{ background:'#fff5f0', border:'1.5px solid var(--clay-light)', borderRadius:16,
              padding:'16px 18px', marginBottom:18, textAlign:'left' }}>
              <p style={{ color:'var(--clay-deep)', fontSize:'.88rem', lineHeight:1.65, marginBottom:12 }}>
                <strong>{session.detectedFaces ?? faceCountForQuote} personnages repérés</strong> — maximum{' '}
                <strong>{MAX_FACES} figurines</strong> par commande. Choisissez une photo avec {MAX_FACES} personnes ou moins.
              </p>
              <PhotoUploadZone compact onFile={onPhotoUpload} label="Choisir une autre photo"
                hint={`Jusqu'à ${MAX_FACES} personnages`} />
              <div style={{ marginTop:14 }}>
                <PersonCountQuestion
                  count={Math.min(MAX_FACES, session.faceCount ?? MAX_FACES)}
                  detected={session.detectedFaces}
                  max={MAX_FACES}
                  onChange={onFaceCountChange}
                  photoUrl={session.photoUrl}
                />
              </div>
            </div>
          )}

          {isExampleOnly && !tooManyFaces && (
            <div style={{ background:'#fff', border:'1.5px solid var(--bark-light)', borderRadius:16,
              padding:'16px 18px', marginBottom:18, textAlign:'left' }}>
              <p style={{ color:'var(--dark)', fontSize:'.88rem', lineHeight:1.65, marginBottom:10 }}>
                Exemple du <strong>rendu atelier</strong> (figurines bois sur établi). Uploadez votre photo pour voir votre groupe personnalisé.
              </p>
              <PhotoUploadZone compact onFile={onPhotoUpload} label="Uploader ma photo de groupe"
                hint="Comptage des personnages · Aperçu gratuit" />
            </div>
          )}

          <p style={{ color:'var(--muted)', marginBottom:14, lineHeight:1.7, fontSize:'.9rem' }}>
            {previewFailed && 'L\'aperçu n\'a pas pu être préparé — exemple affiché. '}
            {hasAiPreview && session.faceCount != null && (
              <><strong>{session.faceCount} personnage{session.faceCount > 1 ? 's' : ''}</strong> pour votre commande, prêt{session.faceCount > 1 ? 's' : ''} à être taillé{session.faceCount > 1 ? 's' : ''} en bois. </>
            )}
            Ceci est un <strong>aperçu filigrané</strong> — après commande, l&apos;atelier vous accompagne pour peaufiner chaque figurine avant fabrication.
          </p>

          <div style={{ background:'var(--forest-pale)', borderRadius:14, padding:'14px 16px',
            marginBottom:18, textAlign:'left' }}>
            <p style={{ color:'var(--forest)', fontSize:'.82rem', lineHeight:1.65, margin:0 }}>
              <strong>Après commande</strong> : ajustez chaque figurine dans notre studio, affinez les traits et validez avant la découpe laser à Nantes.
            </p>
          </div>

          {previewFailed && (
            <p style={{ color:'var(--clay-deep)', fontSize:'.82rem', marginBottom:12 }}>{session.error}</p>
          )}

          {showCountAdjuster && !tooManyFaces && (
            <div style={{ marginBottom:18 }}>
              <PersonCountQuestion
                count={session.faceCount ?? 2}
                detected={session.detectedFaces}
                max={MAX_FACES}
                onChange={onFaceCountChange}
                photoUrl={session.photoUrl}
              />
            </div>
          )}

          <div style={{ position:'relative', borderRadius:20, overflow:'hidden',
            boxShadow:'0 16px 48px rgba(44,31,20,.13)' }}>
            {previewLoading ? (
              <PreviewLoadingEncart photoUrl={session.photoUrl} />
            ) : (
              <WatermarkedPreview src={previewSrc} alt="Aperçu figurines bois" style={{ width:'100%', display:'block' }} />
            )}
            {!previewLoading && (
              <>
                <div style={{ position:'absolute', inset:0, pointerEvents:'none',
                  background:'repeating-linear-gradient(-24deg, transparent, transparent 22px, rgba(44,31,20,.06) 22px, rgba(44,31,20,.06) 44px)' }}/>
                <div style={{ position:'absolute', top:14, left:14, background:'rgba(44,31,20,.82)',
                  color:'#fff', borderRadius:100, padding:'6px 14px', fontSize:'.72rem', fontWeight:700 }}>
                  {hasAiPreview ? 'APERÇU · filigrane' : 'EXEMPLE · filigrane'}
                </div>
                <div style={{ position:'absolute', bottom:16, left:'50%', transform:'translateX(-50%)',
                  whiteSpace:'nowrap', background:'rgba(44,31,20,.78)', color:'#fff', borderRadius:100,
                  padding:'8px 20px', fontSize:'.78rem', fontWeight:600, backdropFilter:'blur(8px)' }}>
                  {hasAiPreview ? 'Version finale + studio après commande' : 'Uploadez votre photo pour un aperçu perso'}
                </div>
              </>
            )}
          </div>
        </div>

        <div style={{ position:'sticky', top:80 }}>
          <div style={{ background:'#fff', borderRadius:24, padding:34,
            boxShadow:'0 16px 48px rgba(44,31,20,.09)' }}>
            {hasQuote ? (
              <>
                <h3 style={{ color:'var(--dark)', marginBottom:8, fontSize:'1.35rem' }}>{quote.label}</h3>
                <p style={{ color:'var(--muted)', fontSize:'.88rem', marginBottom:12, lineHeight:1.6 }}>
                  {quote.faceCount} figurine{quote.faceCount > 1 ? 's' : ''} · fabrication Nantes · expédition vendredi
                </p>
              </>
            ) : (
              <>
                <h3 style={{ color:'var(--dark)', marginBottom:8, fontSize:'1.35rem' }}>Photo trop chargée</h3>
                <p style={{ color:'var(--muted)', fontSize:'.88rem', marginBottom:12, lineHeight:1.6 }}>
                  Maximum {MAX_FACES} personnages par commande
                </p>
              </>
            )}

            <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:18,
              padding:'12px 14px', background:'var(--bark-pale)', borderRadius:12, fontSize:'.78rem', color:'var(--muted)' }}>
              <span>✓ Aperçu gratuit (filigrané)</span>
              <span>✓ Studio d&apos;édition après commande</span>
              <span>✓ Fabrication laser bois contreplaqué</span>
            </div>

            {hasQuote && (
              <div style={{ display:'flex', flexDirection:'column', gap:10,
                paddingBottom:20, borderBottom:'1.5px solid var(--bark-pale)', marginBottom:20 }}>
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ fontSize:'.86rem', color:'var(--muted)' }}>{quote.basePack.label}</span>
                  <span style={{ fontWeight:700 }}>{quote.basePriceEur} €</span>
                </div>
                {quote.extraCount > 0 && (
                  <div style={{ display:'flex', justifyContent:'space-between' }}>
                    <span style={{ fontSize:'.86rem', color:'var(--muted)' }}>
                      + {quote.extraCount} pers. × {quote.extraPersonEur} €
                    </span>
                    <span style={{ fontWeight:700 }}>
                      {(quote.extraCount * Number(quote.extraPersonEur)).toFixed(2)} €
                    </span>
                  </div>
                )}
                {Number(quote.shippingEur) > 0 ? (
                  <div style={{ display:'flex', justifyContent:'space-between' }}>
                    <span style={{ fontSize:'.86rem', color:'var(--muted)' }}>Frais de port</span>
                    <span style={{ fontWeight:700 }}>{Number(quote.shippingEur).toFixed(0)} €</span>
                  </div>
                ) : (
                  <div style={{ fontSize:'.82rem', color:'var(--forest)' }}>🎁 Port offert</div>
                )}
              </div>
            )}

            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:22 }}>
              <span style={{ fontFamily:'Quicksand', fontWeight:700, fontSize:'1.05rem', color:'var(--dark)' }}>Total TTC</span>
              <span style={{ fontFamily:'Quicksand', fontWeight:700, fontSize:'2rem', color:'var(--clay)' }}>
                {hasQuote ? `${quote.totalEur} €` : '—'}
              </span>
            </div>

            {error && <p style={{ color:'var(--clay-deep)', fontSize:'.85rem', marginBottom:12 }}>{error}</p>}

            <button className="btn-clay" style={{ width:'100%', padding:'16px', fontSize:'.95rem',
              opacity: (soldOut || tooManyFaces) ? .5 : 1 }}
              disabled={busy || soldOut || tooManyFaces || !hasQuote}
              onClick={pay}>
              {tooManyFaces ? `Max ${MAX_FACES} personnages`
                : soldOut ? 'Complet cette semaine'
                : busy ? 'Redirection vers le paiement…'
                : 'Commander et peaufiner à l\'atelier →'}
            </button>

            <p style={{ fontSize:'.72rem', color:'var(--muted)', marginTop:14, textAlign:'center', lineHeight:1.55 }}>
              Paiement sécurisé · Pack de base + {extraEur.toFixed(2)} € / pers. supplémentaire
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

            </div>

            {/* Regen */}
            <div style={{ background:'rgba(192,104,74,.1)',
              border:'1px solid rgba(192,104,74,.25)', borderRadius:14,
              padding:'16px 18px', marginBottom:18 }}>
              <div style={{ display:'flex', justifyContent:'space-between',
                alignItems:'center', marginBottom:12 }}>
                <span style={{ color:'#fff', fontWeight:600, fontSize:'.85rem' }}>
                  Générer une nouvelle version
                </span>
                <span style={{ background:'rgba(192,104,74,.25)',
                  color:'var(--clay-light)', borderRadius:100,
                  padding:'3px 10px', fontSize:'.7rem', fontWeight:700 }}>
                  {regens} restant{regens !== 1 ? 's' : ''}
                </span>
              </div>
              <button className="btn-clay" style={{ width:'100%', padding:'12px',
                fontSize:'.85rem', opacity: regens === 0 ? .4 : 1 }}
                onClick={doRegen} disabled={regens === 0 || regen}>
                {regen ? '⚙️ Préparation…' : '🔄 Nouvelle version'}
              </button>
              {regens === 0 && (
                <p style={{ fontSize:'.72rem', color:'rgba(255,255,255,.3)',
                  textAlign:'center', marginTop:8 }}>
                  Essais épuisés pour cette figurine
                </p>
              )}
            </div>

            {/* Adjustments */}
            <div style={{ marginBottom:18 }}>
              <label style={{ display:'block', color:'rgba(255,255,255,.4)',
                fontSize:'.68rem', fontWeight:700, letterSpacing:'.1em',
                textTransform:'uppercase', marginBottom:10 }}>
                Ajustements fins
              </label>
              <div style={{ display:'flex', flexDirection:'column', gap:7 }}>
                {ADJS.map(a => (
                  <button key={a} style={{ background:'rgba(255,255,255,.055)',
                    border:'1px solid rgba(255,255,255,.09)', borderRadius:10,
                    padding:'10px 14px', color:'rgba(255,255,255,.78)',
                    fontSize:'.8rem', textAlign:'left', cursor:'pointer',
                    transition:'all .2s', fontFamily:'Montserrat' }}
                    onMouseEnter={e => {
                      e.currentTarget.style.background = 'rgba(192,104,74,.14)';
                      e.currentTarget.style.borderColor = 'rgba(192,104,74,.35)';
                    }}
                    onMouseLeave={e => {
                      e.currentTarget.style.background = 'rgba(255,255,255,.055)';
                      e.currentTarget.style.borderColor = 'rgba(255,255,255,.09)';
                    }}>
                    {a}
                  </button>
                ))}
              </div>
            </div>

            {/* Name input */}
            <div style={{ marginBottom:22 }}>
              <label style={{ display:'block', color:'rgba(255,255,255,.4)',
                fontSize:'.68rem', fontWeight:700, letterSpacing:'.1em',
                textTransform:'uppercase', marginBottom:10 }}>
                Nom gravé sur le socle
              </label>
              <input type="text"
                value={names[sel]}
                onChange={e => setNames(n => ({ ...n, [sel]: e.target.value }))}
                maxLength={14}
                style={{ width:'100%', background:'rgba(255,255,255,.07)',
                  border:'1.5px solid rgba(255,255,255,.14)', borderRadius:10,
                  padding:'12px 14px', color:'#fff', fontSize:'.88rem',
                  fontFamily:'Montserrat', outline:'none' }}
                placeholder="Prénom ou surnom…"/>
              <div style={{ textAlign:'right', fontSize:'.68rem',
                color:'rgba(255,255,255,.22)', marginTop:4 }}>
                {names[sel].length}/14
              </div>
            </div>

            <div style={{ borderTop:'1px solid rgba(255,255,255,.08)',
              paddingTop:18, display:'flex', flexDirection:'column', gap:10 }}>
              <button className="btn-bark" style={{ width:'100%', padding:'12px',
                fontSize:'.85rem' }}
                onClick={() => setSel(null)}>
                ✓ Valider cette figurine
              </button>
              <button className="btn-clay" style={{ width:'100%', padding:'12px',
                fontSize:'.85rem' }}
                onClick={() => go('success')}>
                Envoyer à l'atelier →
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── STATE 5 · SUCCESS ───────────────────────────────────────── */
function Success() {
  const today = new Date();
  const fmt = d => d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  const add = n => { const d = new Date(today); d.setDate(d.getDate() + n); return fmt(d); };

  const steps = [
    { icon:'✅', title:'Aujourd\'hui — Validation',
      sub: add(0),
      desc:'Votre commande est confirmée. On prépare votre groupe avec amour.', done:true },
    { icon:'⚡', title:'Demain — Découpe laser à Nantes',
      sub: add(1),
      desc:'Nos équipes découpent et fabriquent chaque personnage en bois.' },
    { icon:'📦', title:'J+3 — Expédition suivi',
      sub: add(3),
      desc:'Emballage soigné dans notre boîte kraft signature, envoi en Colissimo suivi.' },
    { icon:'🏡', title:'J+5 — Livraison chez vous',
      sub: add(5),
      desc:'Vos MiniNous arrivent ! Prêts à être offerts ou posés dans votre intérieur.' },
  ];

  return (
    <div className="screen" style={{ background:'var(--bark-pale)',
      minHeight:'100vh', padding:'72px 28px' }}>
      <div style={{ maxWidth:680, margin:'0 auto', textAlign:'center' }}>

        {/* Success icon */}
        <div style={{ width:72, height:72, background:'var(--forest)', borderRadius:'50%',
          display:'flex', alignItems:'center', justifyContent:'center',
          margin:'0 auto 24px', boxShadow:'0 12px 36px rgba(74,138,82,.38)' }}>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#fff" strokeWidth="2.8"
              strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>

        <div className="tag" style={{ background:'var(--forest-pale)',
          color:'var(--forest)', marginBottom:16 }}>
          Commande #MN-{Math.floor(Math.random() * 9000) + 1000} confirmée
        </div>

        <h1 style={{ color:'var(--dark)', marginBottom:14,
          fontSize:'clamp(1.7rem, 4vw, 2.6rem)' }}>
          Vos MiniNous partent à l'atelier !
        </h1>
        <p style={{ color:'var(--muted)', maxWidth:460, margin:'0 auto 48px',
          lineHeight:1.75 }}>
          Un email de confirmation a été envoyé. Vous recevrez une photo de vos
          figurines terminées avant expédition — promis.
        </p>

        {/* Timeline */}
        <div style={{ background:'#fff', borderRadius:24, padding:'32px 36px',
          textAlign:'left', boxShadow:'0 16px 48px rgba(44,31,20,.09)', marginBottom:28 }}>
          <h3 style={{ color:'var(--dark)', marginBottom:28, fontFamily:'Quicksand',
            fontSize:'1.15rem' }}>
            Suivi de votre commande
          </h3>
          <div style={{ position:'relative' }}>
            {/* Vertical line */}
            <div style={{ position:'absolute', left:19, top:30, bottom:30, width:2,
              background:'var(--bark-pale)' }}/>
            {steps.map((s, i) => (
              <div key={i} className="tl-item"
                style={{ display:'flex', gap:20,
                  marginBottom: i < steps.length - 1 ? 26 : 0,
                  animationDelay:`${i * .14}s` }}>
                <div style={{ width:40, height:40, borderRadius:'50%', flexShrink:0,
                  background: s.done ? 'var(--forest)' : '#fff',
                  border: s.done ? 'none' : '2px solid var(--bark-light)',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:'1rem', zIndex:1,
                  boxShadow: s.done ? '0 4px 14px rgba(74,138,82,.3)' : 'none' }}>
                  {s.icon}
                </div>
                <div style={{ paddingTop:4 }}>
                  <div style={{ fontFamily:'Quicksand', fontWeight:700,
                    color:'var(--dark)', fontSize:'.92rem', marginBottom:2 }}>
                    {s.title}
                  </div>
                  <div style={{ fontSize:'.73rem', color:'var(--clay)',
                    fontWeight:600, marginBottom:5 }}>{s.sub}</div>
                  <div style={{ fontSize:'.8rem', color:'var(--muted)',
                    lineHeight:1.6 }}>{s.desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Atelier photo */}
        <div style={{ borderRadius:20, overflow:'hidden',
          boxShadow:'0 16px 48px rgba(44,31,20,.13)', marginBottom:28 }}>
          <img src={IMG.atelier} alt="Atelier" style={{ width:'100%',
            maxHeight:260, objectFit:'cover' }}/>
          <div style={{ background:'var(--dark)', padding:'16px 24px',
            display:'flex', justifyContent:'space-between', alignItems:'center', gap:12 }}>
            <div>
              <div style={{ fontFamily:'Quicksand', fontWeight:700, color:'#fff',
                fontSize:'.92rem' }}>Notre atelier · Nantes, Loire-Atlantique</div>
              <div style={{ fontSize:'.73rem', color:'rgba(255,255,255,.38)' }}>
                Fabrication locale · Bois de qualité · Atelier Nantes
              </div>
            </div>
            <div style={{ background:'var(--clay)', borderRadius:10,
              padding:'7px 14px', fontSize:'.72rem', color:'#fff',
              fontWeight:700, flexShrink:0 }}>
              🇫🇷 Made in France
            </div>
          </div>
        </div>

        {/* Share CTA */}
        <div style={{ display:'flex', gap:12, justifyContent:'center', flexWrap:'wrap' }}>
          <button className="btn-clay" style={{ padding:'14px 30px', fontSize:'.9rem' }}>
            🎁 Partager ma création
          </button>
          <button className="btn-ghost" style={{ padding:'14px 30px', fontSize:'.9rem' }}>
            ← Créer un autre set
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── APP SHELL ───────────────────────────────────────────────── */
const NAV_STEPS = [
  { id:'landing',    label:'Photo' },
  { id:'pricing',    label:'Aperçu' },
  { id:'editor',     label:'Studio' },
  { id:'success',    label:'Atelier' },
];

function App() {
  const [state, setState] = useState('landing');
  const [selectedPack, setSelectedPack] = useState('famille');
  const [session, setSession] = useState({
    enterVia: null,
    photoUrl: null,
    photoBase64: null,
    previewUrl: null,
    detectedFaces: null,
    faceCount: null,
    previewGen: 0,
    previewLoading: false,
    error: null,
  });
  const [tick, setTick] = useState(0);
  const { status } = useWeekStatus();
  const packs = status?.packs ?? DEFAULT_PACKS;
  const packDef = getPackDef(selectedPack || 'famille', packs);

  const go = useCallback(next => {
    setTick(t => t + 1);
    setState(next);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, []);

  const startPackRoute = useCallback((packId) => {
    setSelectedPack(packId);
    setSession({
      enterVia: 'pack',
      photoUrl: null,
      photoBase64: null,
      previewUrl: null,
      detectedFaces: null,
      faceCount: null,
      previewGen: 0,
      previewLoading: false,
      error: null,
    });
    go('pricing');
  }, [go]);

  const beginPhotoFlow = useCallback(async (file, { enterVia = 'upload' } = {}) => {
    try {
      const { photoUrl, photoBase64 } = await readImageFile(file);
      let detected = 0;
      try {
        detected = await detectFaceCount(photoBase64);
      } catch { /* fallback */ }
      const initialCount = detected > 0 ? Math.min(MAX_FACES, detected) : 2;
      setSelectedPack(packIdForFaceCount(initialCount));
      setSession(s => ({
        enterVia,
        photoUrl,
        photoBase64,
        previewUrl: null,
        detectedFaces: detected > 0 ? detected : null,
        faceCount: initialCount,
        previewGen: (s.previewGen ?? 0) + 1,
        previewLoading: true,
        error: null,
      }));
      setTick(t => t + 1);
      go('pricing');
    } catch {
      alert('Impossible de lire cette image. Essayez un autre fichier.');
    }
  }, [go]);

  const onPhotoUpload = useCallback((file) => {
    beginPhotoFlow(file, { enterVia: 'upload' });
  }, [beginPhotoFlow]);

  const onPaywallPhotoUpload = useCallback((file) => {
    beginPhotoFlow(file, { enterVia: 'upload' });
  }, [beginPhotoFlow]);

  const onPreviewReady = useCallback((previewUrl) => {
    setSession(s => ({ ...s, previewUrl, previewLoading: false, error: null }));
  }, []);

  const onPreviewError = useCallback((message) => {
    setSession(s => ({ ...s, error: message || 'Aperçu indisponible pour le moment', previewLoading: false }));
  }, []);

  const onFaceCountChange = useCallback((count) => {
    const n = Math.max(1, Math.min(MAX_FACES, count));
    setSelectedPack(packIdForFaceCount(n));
    setSession(s => ({
      ...s,
      faceCount: n,
      previewUrl: null,
      previewLoading: !!s.photoBase64,
      previewGen: (s.previewGen ?? 0) + 1,
      error: null,
    }));
  }, []);

  const idx = NAV_STEPS.findIndex(s => s.id === state);

  const screens = {
    landing:    <Landing onPackExample={startPackRoute} onPhotoUpload={onPhotoUpload} />,
    pricing:    <Paywall packDef={packDef} status={status} session={session} packs={packs}
                  onPhotoUpload={onPaywallPhotoUpload}
                  onPreviewReady={onPreviewReady} onPreviewError={onPreviewError}
                  onFaceCountChange={onFaceCountChange} />,
    editor:     <Editor     go={go}/>,
    success:    <Success/>,
  };

  return (
    <>
      {/* Top progress bar */}
      <div style={{ position:'fixed', top:0, left:0, right:0, height:3, zIndex:9999,
        background:'rgba(196,168,130,.25)' }}>
        <div style={{ height:'100%',
          background:'linear-gradient(90deg,var(--clay),var(--bark-light))',
          width:`${((idx + 1) / NAV_STEPS.length) * 100}%`,
          transition:'width .65s cubic-bezier(.4,0,.2,1)' }}/>
      </div>

      <div key={tick}>
        {screens[state]}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
