<style>
:root {
  --clay:#C0684A; --clay-light:#E8A088; --clay-pale:#FAF0EB; --clay-deep:#8A4030;
  --bark:#7A5C38; --bark-light:#C4A882; --bark-pale:#F5EDE0;
  --forest:#4A8A52; --forest-light:#A8D4AC; --forest-pale:#EBF4EC;
  --cream:#FAF7F2; --dark:#2C1F14; --text:#3D3530; --muted:#9A8F88;
  --t:.32s cubic-bezier(.4,0,.2,1);
  --t-spring:.48s cubic-bezier(.34,1.56,.64,1);
  --vh:1vh;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden}
h1,h2,h3,h4{font-family:'Quicksand',sans-serif;font-weight:700;line-height:1.15}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input{font-family:inherit}

/* Screens */
.screen{min-height:100vh;min-height:calc(var(--vh,1vh)*100);animation:screenIn .5s cubic-bezier(.4,0,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* Nav */
.nav-glass{background:rgba(250,247,242,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(196,168,130,.2)}
.nav-account-link{font-family:Quicksand,sans-serif;font-size:.82rem;font-weight:600;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:100px;transition:color var(--t),background var(--t)}
.nav-account-link:hover{color:var(--clay);background:var(--clay-pale)}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* Buttons */
.btn-clay{background:linear-gradient(135deg,var(--clay) 0%,#A85238 100%);color:#fff;border-radius:100px;font-family:'Quicksand',sans-serif;font-weight:700;transition:all var(--t-spring);box-shadow:0 8px 24px rgba(192,104,74,.38)}
.btn-clay:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 36px rgba(192,104,74,.52)}
.btn-clay:active{transform:scale(.97)}
.btn-bark{background:linear-gradient(135deg,var(--bark) 0%,#5A4228 100%);color:#fff;border-radius:100px;font-family:'Quicksand',sans-serif;font-weight:700;transition:all var(--t);box-shadow:0 6px 18px rgba(122,92,56,.32)}
.btn-bark:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(122,92,56,.45)}
.btn-ghost{border:2px solid var(--bark-light);color:var(--bark);border-radius:100px;font-family:'Quicksand',sans-serif;font-weight:700;transition:all var(--t)}
.btn-ghost:hover{background:var(--bark-pale);border-color:var(--bark)}

/* Before/After */
.ba-wrap{position:relative;overflow:hidden;border-radius:20px;cursor:ew-resize;user-select:none;touch-action:none}
.ba-after{position:absolute;inset:0;overflow:hidden}
.ba-handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;transform:translateX(-50%);z-index:10;pointer-events:none}
.ba-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;pointer-events:none;left:50%;transform:translate(-50%,-50%)}

/* Dropzone */
.dropzone{border:3px dashed var(--bark-light);transition:all .3s ease;background:linear-gradient(135deg,var(--bark-pale) 0%,var(--cream) 100%);border-radius:28px}
.dropzone.drag-over,.dropzone:hover{border-color:var(--clay);background:linear-gradient(135deg,var(--clay-pale) 0%,var(--cream) 100%);transform:scale(1.01)}

/* Bounding boxes */
.bbox{position:absolute;border:2.5px solid #00FF88;border-radius:4px;box-shadow:0 0 14px rgba(0,255,136,.5),inset 0 0 14px rgba(0,255,136,.05);animation:bboxIn .35s ease-out both;pointer-events:none}
.bbox-label{position:absolute;top:-22px;left:0;background:#00FF88;color:#001A0A;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap}
@keyframes bboxIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#00FF88 40%,#00FF88 60%,transparent);box-shadow:0 0 20px #00FF88;animation:scan 2s linear infinite;pointer-events:none}
@keyframes scan{from{top:0}to{top:100%}}

/* Progress */
.prog-fill{height:100%;background:linear-gradient(90deg,var(--clay),var(--bark-light));border-radius:100px;transition:width .5s ease;position:relative;overflow:hidden}
.prog-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* Toggle */
.tgl-track{width:52px;height:28px;border-radius:100px;transition:background .3s;cursor:pointer;position:relative;flex-shrink:0}
.tgl-thumb{position:absolute;top:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22);transition:left var(--t-spring)}

/* Figurine card */
.fig-card{transition:all var(--t-spring);cursor:pointer;text-align:center;position:relative}
.fig-card:hover{transform:translateY(-10px) scale(1.06)}
.fig-card.active{transform:translateY(-10px) scale(1.06)}
.fig-ring{position:absolute;inset:-10px;border-radius:18px;border:2px solid var(--clay);box-shadow:0 0 24px rgba(192,104,74,.45);pointer-events:none;animation:screenIn .3s ease}

/* Side panel */
.side-panel{border-left:1px solid rgba(255,255,255,.08);animation:panelIn .4s var(--t-spring) both}
@keyframes panelIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}

/* Stripe modal */
.modal-overlay{position:fixed;inset:0;background:rgba(44,31,20,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;animation:screenIn .3s ease}

/* Timeline */
.tl-item{animation:tlIn .5s ease both}
@keyframes tlIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}

/* Pulse */
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}

/* Spin */
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spin{animation:spin .75s linear infinite}

/* Review stars */
.stars{color:#F5C518;letter-spacing:2px}

/* Responsive */
@media(max-width:768px){
  .two-col{grid-template-columns:1fr !important}
  .hero-section{padding:16px 16px 28px !important}
  .hero-grid{grid-template-columns:1fr !important;gap:14px !important;padding:0 !important}
  .hero-img{order:2}
  .hero-text{order:1}
  .hero-mobile-peek{order:3;display:block !important}
  .hero-quick-steps{order:4;display:flex !important}
  .hero-cta-block{order:5;display:block !important}
  .hero-text .hero-cta-row{display:none !important}
  .hero-text .hero-lead{display:block !important;font-size:.86rem !important;line-height:1.62 !important;margin-bottom:12px !important;max-width:none}
  .hero-text .hero-tag{display:none}
  .hero-text .hero-edition{display:none}
  .hero-text h1{font-size:1.65rem !important;margin-bottom:10px !important;line-height:1.15 !important}
  .hero-cta-block .btn-clay{width:100%;justify-content:center;padding:13px 20px !important;font-size:.92rem !important;display:flex;align-items:center;gap:10px}
  .hero-photo-wrap{position:relative;max-height:140px;aspect-ratio:16/10;border-radius:14px;box-shadow:0 16px 40px rgba(44,31,20,.12)}
  .hero-mobile-rating{display:flex !important}
  .hide-mobile{display:none !important}
  .nav-glass{padding:10px 14px !important}
  .nav-glass .btn-clay-nav{display:none !important}
  .how-cards{grid-template-columns:1fr !important; gap:12px !important}
  .how-card{display:flex !important; align-items:center; gap:16px; text-align:left !important; padding:16px 18px !important}
  .how-card p{margin:0}
  .landing-triptyque-full{display:none !important}
  .section-tight-mobile{padding:40px 16px !important}
}
@media(min-width:769px){
  .hero-mobile-peek,.hero-quick-steps,.hero-mobile-rating,.hero-cta-block{display:none !important}
  .hero-text .hero-cta-row{display:flex !important}
}

/* FOMO + packs */
.fomo-bar{position:relative;background:linear-gradient(90deg,var(--dark) 0%,#3d2a1c 100%);color:rgba(255,255,255,.88);padding:6px 16px;text-align:center;font-size:.72rem;font-weight:600;letter-spacing:.01em;box-shadow:0 2px 12px rgba(0,0,0,.1);line-height:1.3;z-index:51}
.fomo-bar-inner{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;width:100%}
.fomo-bar strong{color:#FCD34D;font-weight:700}
.fomo-countdown{font-variant-numeric:tabular-nums;color:var(--clay-light);white-space:nowrap}
.fomo-sep{opacity:.35;user-select:none}
.fomo-detail{opacity:.75;white-space:nowrap}
.fomo-mobile-label{display:none;opacity:.75;white-space:nowrap}
.fomo-chevron{display:none;font-size:.56rem;opacity:.5;margin-left:2px;transition:transform .2s ease}
.fomo-bar-open .fomo-chevron{transform:rotate(180deg);opacity:.85}
/* Panel expanded */
.fomo-panel{position:absolute;top:100%;left:0;right:0;background:linear-gradient(90deg,#1e130a 0%,#2a1a10 100%);border-top:1px solid rgba(255,255,255,.07);padding:16px 20px 14px;text-align:left;z-index:50;box-shadow:0 8px 28px rgba(0,0,0,.28);animation:fomoIn .18s ease both}
@keyframes fomoIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.fomo-panel-title{font-family:Quicksand,sans-serif;font-weight:700;font-size:.82rem;color:rgba(255,255,255,.9);margin-bottom:12px;padding-right:28px}
.fomo-panel-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.fomo-panel-row{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:rgba(255,255,255,.6);gap:12px}
.fomo-panel-row strong{color:#FCD34D;font-weight:700;white-space:nowrap}
.fomo-panel-hint{font-size:.68rem;color:rgba(255,255,255,.35);line-height:1.55}
.fomo-close{position:absolute;top:10px;right:12px;color:rgba(255,255,255,.4);background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s;line-height:1}
.fomo-close:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.09)}
@media(max-width:768px){
  .fomo-bar{padding:5px 10px;font-size:.62rem;cursor:pointer}
  .fomo-bar-inner{cursor:pointer}
  .fomo-detail{display:none}
  .fomo-mobile-label{display:inline}
  .fomo-chevron{display:inline}
  .fomo-sep.fomo-sep-first{display:none}
}
.pack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}
@media(max-width:768px){.pack-grid{grid-template-columns:1fr}}
.pack-card{background:#fff;border-radius:20px;padding:28px 24px;border:2px solid var(--bark-pale);transition:all var(--t);text-align:left;display:flex;flex-direction:column;gap:12px}
.pack-card:hover{border-color:var(--clay);box-shadow:0 12px 40px rgba(192,104,74,.15);transform:translateY(-4px)}
.pack-card.featured{border-color:var(--clay);box-shadow:0 16px 48px rgba(192,104,74,.2)}
.pack-photo{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--bark-pale);margin-bottom:4px}
.pack-photo img{width:100%;height:100%;object-fit:cover;display:block}
.pack-price{font-family:Quicksand,sans-serif;font-size:1.75rem;font-weight:700;color:var(--dark);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.pack-price small{font-size:.85rem;font-weight:500;color:var(--muted)}
.pack-price .pack-shipping{font-size:.72rem;font-weight:500;color:var(--muted)}
.office-reveal-wrap{max-width:720px;margin:44px auto 0;text-align:center}
.office-reveal-title{font-family:Quicksand,sans-serif;color:var(--dark);font-size:clamp(1.1rem,2.5vw,1.35rem);margin-bottom:6px}
.office-reveal-hint{font-size:.82rem;color:var(--muted);margin-bottom:14px}
.office-reveal{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 16px 48px rgba(44,31,20,.12);aspect-ratio:16/10;background:var(--bark-pale);cursor:ew-resize;touch-action:none;user-select:none}
.office-reveal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;pointer-events:none}
.office-reveal-photo{z-index:2}
.office-reveal-lineart{z-index:1}
.office-reveal-handle{position:absolute;top:0;bottom:0;z-index:3;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(44,31,20,.12);transform:translateX(-50%);pointer-events:none}
.office-reveal-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--clay);box-shadow:0 4px 16px rgba(44,31,20,.14)}
.office-reveal-labels{display:flex;justify-content:space-between;margin-top:10px;padding:0 4px;font-size:.72rem;font-weight:600;color:var(--muted)}

/* Triptyque Photo → Tracé → Déco */
.triptych{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;max-width:920px;margin:0 auto}
.triptych.triptych-vertical{grid-template-columns:1fr;max-width:380px;gap:8px}
.triptych-vertical .triptych-arrow{display:block;text-align:center;font-size:1.1rem;line-height:1}
.triptych-step{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 12px 36px rgba(44,31,20,.12);background:#fff}
.triptych-step img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center;display:block}
.triptych-step img.crop-top{object-position:top center}
.triptych-step-contain{background:var(--bark-pale)}
.triptych-step-contain img{object-fit:contain !important;object-position:center !important}
.triptych-step-contain img.crop-top{object-position:center !important}
.paywall-photo-thumb{width:80px;height:60px;border-radius:8px;border:2px solid var(--bark-light);flex-shrink:0;background:var(--bark-pale);display:flex;align-items:center;justify-content:center;overflow:hidden}
.paywall-photo-thumb img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.paywall-composition-card{padding:0 !important;overflow:hidden}
.paywall-composition-card .paywall-card-body{padding:14px 16px}
.paywall-card-photo-header{padding:16px;background:var(--bark-pale);border-bottom:1.5px solid var(--bark-light);min-height:140px;display:flex;align-items:center;justify-content:center}
.paywall-photo-overlay{position:relative;display:inline-block;max-width:min(100%,360px);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(44,31,20,.08);line-height:0}
.paywall-photo-overlay img{max-height:200px;width:100%;height:auto;object-fit:contain;display:block;vertical-align:middle}
.paywall-face-boxes{position:absolute;inset:0;pointer-events:none;border-radius:16px;overflow:hidden}
.paywall-face-boxes::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent,transparent 10px,rgba(192,104,74,.028) 10px,rgba(192,104,74,.028) 11px);pointer-events:none;opacity:.85}
.paywall-face-box{position:absolute;border:1.5px dashed rgba(192,104,74,.52);border-radius:10px;background:rgba(250,247,242,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);animation:paywallBoxIn .45s cubic-bezier(.4,0,.2,1) both}
.paywall-face-box:nth-child(2){animation-delay:.07s}.paywall-face-box:nth-child(3){animation-delay:.14s}.paywall-face-box:nth-child(4){animation-delay:.21s}
.paywall-face-box:nth-child(5){animation-delay:.28s}.paywall-face-box:nth-child(6){animation-delay:.35s}.paywall-face-box:nth-child(7){animation-delay:.42s}.paywall-face-box:nth-child(8){animation-delay:.49s}
@keyframes paywallBoxIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.paywall-card-photo-header img{max-height:200px;max-width:min(100%,360px);width:auto;height:auto;object-fit:contain;display:block;border-radius:16px;box-shadow:0 4px 16px rgba(44,31,20,.08)}
.paywall-shipping-note{font-size:.72rem;color:var(--muted);margin-top:8px;text-align:right;line-height:1.5}
.triptych-dual{grid-template-columns:1fr auto 1fr !important;max-width:640px}
.triptych-vertical.triptych-dual{max-width:100%}
.paywall-delivery-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--bark-light);cursor:pointer;background:#fff;transition:border-color .2s,background .2s}
.paywall-delivery-opt:hover{border-color:var(--clay-light)}
.paywall-delivery-opt.selected{border-color:var(--clay);background:var(--clay-pale)}
.paywall-delivery-opt input{margin-top:3px;accent-color:var(--clay)}
.triptych-ratio-square .triptych-step img{aspect-ratio:1/1}
.triptych-ratio-landscape .triptych-step img{aspect-ratio:16/10}
.triptych.triptych-vertical.triptych-ratio-landscape{max-width:100%;gap:6px}
.triptych-paywall.triptych-vertical{max-width:min(100%,300px);gap:5px;margin-left:auto;margin-right:auto}
.triptych-paywall .triptych-step{border-radius:12px;box-shadow:0 6px 18px rgba(44,31,20,.1)}

<body>
<div id="root"></div>
<script type="text/babel">
/** @jsx React.createElement */
const { useState, useEffect, useRef, useCallback } = React;

function BuildFooter({ dark, sticky }) {
  const [info, setInfo] = useState(null);
  useEffect(() => {
    fetch('/build-info.json', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null))
      .then(data => { if (data?.version) setInfo(data); })
      .catch(() => {});
  }, []);
  if (!info?.version) return null;
  return (
    <footer
      className={`mn-build-footer${dark ? ' mn-build-footer--dark' : ''}${sticky ? ' mn-build-footer--sticky' : ''}`}
      aria-label="Version de l'application"
    >
      Les MiniNous · v{info.version} · {info.committedAtLabel}
    </footer>
  );
}

async function checkoutByFaces(faceCount, opts = {}) {
  const res = await fetch('/api/checkout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ faceCount, ...opts }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erreur paiement');
  if (data.accessToken) {
    try { localStorage.setItem('mn_order_token', data.accessToken); } catch {}
  }
  window.location.href = data.url;
}

async function startOrderDraft({ faceCount, packType, childCount, photoBase64 }) {
  const res = await fetch('/api/order-start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ faceCount, packType, childCount, photoBase64 }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erreur création commande');
  if (data.accessToken) {
    try { localStorage.setItem('mn_order_token', data.accessToken); } catch {}
  }
  return data;
}

async function patchOrderDraft({ accessToken, faceCount, childCount, photoBase64 }) {
  const res = await fetch('/api/order-start', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ accessToken, faceCount, childCount, photoBase64 }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erreur mise à jour commande');
  return data;
}

const FRIDAY_DELIVERY_EUR_FALLBACK = 4;

function addDaysYmd(ymd, days) {
  const d = new Date(`${ymd}T12:00:00`);
  d.setDate(d.getDate() + days);
  return d.toLocaleDateString('en-CA');
}

function formatFrDateYmd(ymd) {
  if (!ymd) return null;
  return new Date(`${ymd}T12:00:00`).toLocaleDateString('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'long',
  });
}

function paywallDeliveryDates(status) {
  const ship = status?.shipDate;
  if (!ship) return { tuesday: 'mardi suivant', friday: 'vendredi' };
  return {
    tuesday: formatFrDateYmd(addDaysYmd(ship, 4)),
    friday: formatFrDateYmd(ship),
  };
}

function useQuote(faceCount, fridayDelivery, shippingZone) {
  const [quote, setQuote] = useState(null);
  const [loading, setLoading] = useState(false);
  useEffect(() => {
    const n = Number(faceCount);
    if (!Number.isFinite(n) || n < 1) {
      setQuote(null);
      setLoading(false);
      return;
    }
    let cancelled = false;
    setLoading(true);
    const params = new URLSearchParams({ faces: String(n) });
    if (fridayDelivery) params.set('friday', '1');
    if (shippingZone) params.set('zone', shippingZone);
    fetch(`/api/quote?${params}`)
      .then(r => r.json())
      .then(data => { if (!cancelled) setQuote(data); })
      .catch(() => { if (!cancelled) setQuote({ ok: false, reason: 'network' }); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [faceCount, fridayDelivery, shippingZone]);
  return { quote, loading };
}

function useWeekStatus() {
  const [status, setStatus] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    fetch('/api/week-status')
      .then(r => r.json())
      .then(setStatus)
      .catch(e => setErr(e.message));
  }, []);
  return { status, err };
}

function formatCountdownMs(diff) {
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (d > 0) return `${d}j ${h}h ${String(m).padStart(2, '0')}m`;
  return `${h}h ${String(m).padStart(2, '0')}m`;
}

function FomoBar() {
  const { status } = useWeekStatus();
  const [now, setNow] = useState(Date.now());
  const [expanded, setExpanded] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (!expanded) return;
    const close = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setExpanded(false);
    };
    document.addEventListener('pointerdown', close, true);
    return () => document.removeEventListener('pointerdown', close, true);
  }, [expanded]);

  const cutoff = status?.cutoffAt ? new Date(status.cutoffAt).getTime() : null;
  const remaining = status?.displayRemaining ?? status?.remaining ?? '…';
  const capacity = status?.capacity ?? 100;

  let countdown = '…';
  if (cutoff) countdown = formatCountdownMs(Math.max(0, cutoff - now));

  const toggle = () => setExpanded(o => !o);

  return (
    <div ref={ref} className={`fomo-bar${expanded ? ' fomo-bar-open' : ''}`}>
      <div className="fomo-bar-inner" onClick={toggle}
        role="button" tabIndex={0} onKeyDown={e => e.key === 'Enter' && toggle()}
        aria-expanded={expanded} aria-label="Prochaine fabrication, détails">
        <span className="fomo-detail">Prochaine fabrication</span>
        <span className="fomo-mobile-label">Prochaine fab.</span>
        <span className="fomo-sep fomo-sep-first" aria-hidden="true">·</span>
        <span className="fomo-countdown">{countdown}</span>
        <span className="fomo-sep" aria-hidden="true">·</span>
        <span className="fomo-places"><strong>{remaining}</strong>/{capacity} places</span>
        <span className="fomo-chevron" aria-hidden="true">▼</span>
      </div>
      {expanded && (
        <div className="fomo-panel" role="region" aria-label="Détails prochaine fabrication">
          <button className="fomo-close" onClick={() => setExpanded(false)} aria-label="Fermer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              strokeWidth="2.5" strokeLinecap="round" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
          <p className="fomo-panel-title">Prochaine fabrication</p>
          <div className="fomo-panel-rows">
            <div className="fomo-panel-row">
              <span>Fermeture des commandes dans</span>
              <strong>{countdown}</strong>
            </div>
            <div className="fomo-panel-row">
              <span>Places restantes cette semaine</span>
              <strong>{remaining} / {capacity}</strong>
            </div>
          </div>
          <p className="fomo-panel-hint">
            Commandez avant la date limite pour recevoir vos figurines dès vendredi.
          </p>
        </div>
      )}
    </div>
  );
}

const FACE_COUNTER_MAX = 32;

/** Fallback catalogue marketing si week-status pas encore chargé. */
const CATALOG_PACKS_FALLBACK = [
  { id:'duo', label:'Pack Duo', faceCount:2, priceEur:'19.90', shippingEur:'7.00', totalEur:'26.90' },
  { id:'famille', label:'Pack Famille', faceCount:4, priceEur:'34.90', shippingEur:'0.00', totalEur:'34.90' },
  { id:'grande_famille', label:'Pack Grande Famille', faceCount:8, priceEur:'49.90', shippingEur:'0.00', totalEur:'49.90' },
];

/** Visuels atelier par nombre de personnages (photo · tracé · figurines). */

const SHOWCASE_COUNTS = Object.keys(FAMILY_SHOWCASE).map(Number).sort((a, b) => a - b);

/** Version affichage des tracés (évite le flou au downscale des sources pleine résolution). */
function lineartDisplaySrc(url, { wide = false } = {}) {
  if (!url || !/-lineart\.webp$/i.test(url)) return url;
  const suffix = wide ? '-wide-thumb' : '-thumb';
  return url.replace(/-lineart\.webp$/i, `-lineart${suffix}.webp`);
}

function getShowcaseForCount(faceCount) {
  const n = Number(faceCount) || 4;
  if (FAMILY_SHOWCASE[n]) return FAMILY_SHOWCASE[n];
  let best = SHOWCASE_COUNTS[0];
  for (const c of SHOWCASE_COUNTS) {
    if (Math.abs(c - n) < Math.abs(best - n)) best = c;
  }
  return FAMILY_SHOWCASE[best] || FAMILY_SHOWCASE[4];
}

function OfficeRevealSlider() {
  const [pos, setPos] = useState(52);
  const trackRef = useRef(null);
  const dragRef = useRef(false);

  const setFromClientX = useCallback((clientX) => {
    const el = trackRef.current;
    if (!el || clientX == null) return;
    const { left, width } = el.getBoundingClientRect();
    const pct = ((clientX - left) / width) * 100;
    setPos(Math.max(4, Math.min(96, pct)));
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      if (!dragRef.current) return;
      setFromClientX(e.clientX);
    };
    const onUp = () => { dragRef.current = false; };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
  }, [setFromClientX]);

  const startDrag = (e) => {
    dragRef.current = true;
    setFromClientX(e.clientX);
    e.currentTarget.setPointerCapture?.(e.pointerId);
  };

  return (
    <div className="office-reveal-wrap anim-in anim-d2">
      <h3 className="office-reveal-title">Fonctionne aussi pour les collègues</h3>
      <p className="office-reveal-hint">Glissez pour révéler le tracé</p>
      <div
        ref={trackRef}
        className="office-reveal"
        role="slider"
        aria-label="Comparer la photo et le tracé"
        aria-valuemin={4}
        aria-valuemax={96}
        aria-valuenow={Math.round(pos)}
        onPointerDown={startDrag}
      >
        <img className="office-reveal-lineart" src={OFFICE_REVEAL.lineart} alt="" draggable="false" loading="lazy"/>
        <img
          className="office-reveal-photo"
          src={OFFICE_REVEAL.photo}
          alt="Photo de bureau transformée en figurines bois"
          draggable="false"
          loading="lazy"
          style={{ clipPath: `inset(0 ${100 - pos}% 0 0)` }}
        />
        <div className="office-reveal-handle" style={{ left: `${pos}%` }} aria-hidden="true"/>
      </div>
      <div className="office-reveal-labels">
        <span>Photo</span>
        <span>Tracé</span>
      </div>
    </div>
  );
}

/* ─── SVG FIGURINE ────────────────────────────────────────────── */
function Figurine({ person, scale = 1, selected, regen }) {
  const h = person.h * scale;
  const w = h * 0.56;
  const cx = w / 2;
  const hr = h * 0.125; // head radius
  const bodyY = hr * 2 + 3;
  const bodyH = h * 0.34;
  const legH = h * 0.27;
  const isBaby = person.style === 'baby';
  const isElder = person.style === 'elder';

  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none"
      style={{
        filter: selected
          ? 'drop-shadow(0 0 14px rgba(192,104,74,.65))'
          : 'drop-shadow(0 3px 8px rgba(122,92,56,.22))',
        opacity: regen ? 0.25 : 1,
        transition: 'opacity .3s, filter .3s',
        ...(regen ? { filter:'blur(3px)' } : {}),
      }}>
      {/* Head */}
      <circle cx={cx} cy={hr + 1} r={hr} stroke="#7A5C38" strokeWidth="2.2" fill="#F5EDE0"/>
      {/* Hair suggestion */}
      {(person.style === 'woman' || person.style === 'elder') && (
        <path d={`M${cx - hr * .8} ${hr * .6} Q${cx} ${-2} ${cx + hr * .8} ${hr * .6}`}
          stroke="#7A5C38" strokeWidth="1.8" fill="none" strokeLinecap="round"/>
      )}
      {isElder && (
        <path d={`M${cx - hr * .5} ${hr * .3} Q${cx} ${-4} ${cx + hr * .5} ${hr * .3}`}
          stroke="#C4A882" strokeWidth="1.2" fill="none" strokeLinecap="round" strokeDasharray="2 2"/>
      )}
      {/* Neck */}
      <line x1={cx} y1={hr * 2 + 1} x2={cx} y2={bodyY} stroke="#7A5C38" strokeWidth="1.8"/>
      {/* Body */}
      <rect x={cx - w * .21} y={bodyY} width={w * .42} height={bodyH}
        rx={isBaby ? 8 : 5} stroke="#7A5C38" strokeWidth="2.2" fill="#F5EDE0"/>
      {/* Pocket detail for men */}
      {person.style === 'man' && (
        <rect x={cx + w * .04} y={bodyY + bodyH * .15} width={w * .1} height={w * .1}
          rx="2" stroke="#7A5C38" strokeWidth="1.2" fill="none"/>
      )}
      {/* Arms */}
      <line x1={cx - w * .21} y1={bodyY + bodyH * .18}
            x2={cx - w * .43} y2={bodyY + bodyH * .58}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      <line x1={cx + w * .21} y1={bodyY + bodyH * .18}
            x2={cx + w * .43} y2={bodyY + bodyH * .58}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      {/* Hands */}
      <circle cx={cx - w * .43} cy={bodyY + bodyH * .6} r={w * .045}
        stroke="#7A5C38" strokeWidth="1.6" fill="#F5EDE0"/>
      <circle cx={cx + w * .43} cy={bodyY + bodyH * .6} r={w * .045}
        stroke="#7A5C38" strokeWidth="1.6" fill="#F5EDE0"/>
      {/* Legs */}
      <line x1={cx - w * .1} y1={bodyY + bodyH}
            x2={cx - w * .14} y2={bodyY + bodyH + legH}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      <line x1={cx + w * .1} y1={bodyY + bodyH}
            x2={cx + w * .14} y2={bodyY + bodyH + legH}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      {/* Feet */}
      <line x1={cx - w * .14} y1={bodyY + bodyH + legH}
            x2={cx - w * .3}  y2={bodyY + bodyH + legH}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      <line x1={cx + w * .14} y1={bodyY + bodyH + legH}
            x2={cx + w * .3}  y2={bodyY + bodyH + legH}
        stroke="#7A5C38" strokeWidth="2.2" strokeLinecap="round"/>
      {/* Base */}
      <rect x={cx - w * .44} y={h - 9} width={w * .88} height={7}
        rx="3" fill="#C4A882" stroke="#7A5C38" strokeWidth="1.5"/>
    </svg>
  );
}

/* ─── TRIPTYQUE Photo → Tracé → Déco ──────────────────────────── */
function Triptyque({ showcase = IMG.triptych, vertical, ratio, wideLineart, photoContain, hidePhoto, stepLabels, compact }) {
  const ratioClass = ratio === 'square' ? ' triptych-ratio-square'
    : ratio === 'landscape' ? ' triptych-ratio-landscape' : '';
  const landingClass = wideLineart && !vertical ? ' triptych-landing' : '';
  const compactClass = compact ? ' triptych-paywall' : '';
  const steps = [
    ...(hidePhoto ? [] : [{ src: showcase.photo, label: stepLabels?.photo ?? 'Photo' }]),
    { src: lineartDisplaySrc(showcase.lineart, { wide: wideLineart }), label: stepLabels?.lineart ?? 'Tracé', wide: wideLineart },
    { src: showcase.objet, label: stepLabels?.objet ?? 'A la maison' },
  ];
  const dual = hidePhoto && steps.length === 2;
  const arrow = vertical ? '↓' : '→';
  return (
    <div className={`triptych${vertical ? ' triptych-vertical' : ''}${ratioClass}${landingClass}${compactClass}${dual ? ' triptych-dual' : ''}`}>
      {steps.map((s, i) => (
        <React.Fragment key={s.label}>
          {i > 0 && <div className="triptych-arrow" aria-hidden="true">{arrow}</div>}
          <div className={`triptych-step${s.wide ? ' triptych-step-wide' : ''}${i === 0 && photoContain ? ' triptych-step-contain' : ''}`}>
            <img src={s.src} alt={s.label} draggable="false"
              className={i === 0 && !photoContain ? 'crop-top' : undefined}/>
            <div className="triptych-label">{s.label}</div>
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

/* ─── DÉTECTION VISAGES (face-api.js) ─────────────────────────── */
let faceApiReady = false;
async function loadFaceApi() {
  if (faceApiReady) return;
  await new Promise((resolve, reject) => {
    if (window.faceapi) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  const tf = window.faceapi.tf;
  try {
    await tf.setBackend('cpu');
    await tf.ready();
  } catch {
    /* WebGL indisponible — CPU déjà actif ou fallback silencieux */
  }
  const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
  await window.faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  faceApiReady = true;
}

async function detectFaces(dataUrl) {
  try {
    await loadFaceApi();
    const img = new Image();
    img.src = dataUrl;
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
    const imgW = img.naturalWidth || img.width;
    const imgH = img.naturalHeight || img.height;
    const detections = await window.faceapi.detectAllFaces(
      img,
      new window.faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.32 }),
    );
    const sorted = [...detections].sort((a, b) => a.box.x - b.box.x);
    const boxes = sorted.map(d => {
      const b = d.box;
      const padX = b.width * 0.4;
      const padTop = b.height * 0.2;
      const bodyH = b.height * 2.4;
      let x = b.x - padX;
      let y = b.y - padTop;
      let w = b.width + padX * 2;
      let h = b.height + padTop + bodyH;
      x = Math.max(0, x);
      y = Math.max(0, y);
      w = Math.min(imgW - x, w);
      h = Math.min(imgH - y, h);
      return {
        left: (x / imgW) * 100,
        top: (y / imgH) * 100,
        width: (w / imgW) * 100,
        height: (h / imgH) * 100,
      };
    });
    return { count: detections.length, boxes };
  } catch (err) {
    console.warn('[face-api] détection impossible:', err?.message || err);
    return { count: 0, boxes: [] };
  }
}

async function detectFaceCount(dataUrl) {
  const { count } = await detectFaces(dataUrl);
  return count;
}

function isImageFile(file) {
  return file && (
    file.type?.startsWith('image/')
    || /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(file.name || '')
  );
}

function loadImageElementFromFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image illisible')); };
    img.src = url;
  });
}

const MAX_UPLOAD_BYTES = 3 * 1024 * 1024;

async function compressImageFile(file, maxBytes = MAX_UPLOAD_BYTES) {
  if (!file || file.size <= maxBytes) return file;

  const img = await loadImageElementFromFile(file);
  let w = img.naturalWidth;
  let h = img.naturalHeight;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let quality = 0.9;

  for (let pass = 0; pass < 16; pass++) {
    if (pass > 0) {
      if (pass % 2 === 1) quality = Math.max(0.42, quality - 0.08);
      else {
        w = Math.max(720, Math.round(w * 0.86));
        h = Math.max(720, Math.round(h * 0.86));
      }
    }
    const scale = Math.min(1, 4096 / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * scale));
    const ch = Math.max(1, Math.round(h * scale));
    canvas.width = cw;
    canvas.height = ch;
    ctx.drawImage(img, 0, 0, cw, ch);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    if (blob && blob.size <= maxBytes) {
      const base = (file.name || 'photo').replace(/\.[^.]+$/i, '');
      return new File([blob], `${base}.jpg`, { type: 'image/jpeg', lastModified: Date.now() });
    }
  }
  throw new Error('Impossible de compresser sous 3 Mo — essayez une photo plus petite.');
}

async function readImageFile(file) {
  const prepared = await compressImageFile(file);
  return new Promise((resolve, reject) => {
    const photoUrl = URL.createObjectURL(prepared);
    const reader = new FileReader();
    reader.onload = () => resolve({ photoUrl, photoBase64: reader.result, file: prepared });
    reader.onerror = () => { URL.revokeObjectURL(photoUrl); reject(new Error('Lecture impossible')); };
    reader.readAsDataURL(prepared);
  });
}

function PhotoUploadZone({ onFile, onDemo, compact, label, hint, showDemo }) {
  const [drag, setDrag] = useState(false);
  const [loading, setLoading] = useState(false);
  const fileRef = useRef(null);

  const handle = async (file) => {
    if (loading) return;
    if (!isImageFile(file)) {
      alert('Choisissez une image (JPG, PNG, HEIC…).');
      return;
    }
    setLoading(true);
    try {
      const prepared = await compressImageFile(file);
      await onFile(prepared);
    } catch (err) {
      alert(err.message || 'Impossible de traiter cette image.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div>
      <div
        className={`dropzone${drag ? ' drag-over' : ''}${loading ? ' drag-over' : ''}`}
        style={{ padding: compact ? '28px 20px' : '56px 32px', cursor: loading ? 'wait' : 'pointer',
          opacity: loading ? .85 : 1 }}
        onClick={() => !loading && fileRef.current?.click()}
        onDragOver={e => { e.preventDefault(); if (!loading) setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={e => { e.preventDefault(); setDrag(false); if (!loading) handle(e.dataTransfer?.files?.[0]); }}
      >
        <input ref={fileRef} type="file" accept="image/*" style={{ display:'none' }} disabled={loading}
          onChange={e => { handle(e.target.files?.[0]); e.target.value = ''; }} />
        <div style={{ fontSize: compact ? '2rem' : '3.5rem', marginBottom: compact ? 8 : 14 }}>
          {loading ? '⏳' : '📸'}

        <h3 style={{ color:'var(--dark)', marginBottom:8, fontSize: compact ? '1rem' : '1.2rem' }}>
          {loading ? 'On lit votre photo…' : (label || 'Glissez votre photo de groupe ici')}

/* ─── APERÇU FILIGRANÉ ────────────────────────────────────────── */
function WatermarkedPreview({ src, alt, style = {} }) {
  const [displaySrc, setDisplaySrc] = useState(null);
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    if (!src) { setDisplaySrc(null); return undefined; }
    let cancelled = false;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (cancelled) return;
      const maxW = 480;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      ctx.save();
      ctx.globalAlpha = 0.32;
      ctx.fillStyle = '#2C1F14';
      const fontSize = Math.max(14, Math.round(w / 14));
      ctx.font = `700 ${fontSize}px Quicksand, Montserrat, sans-serif`;
      const stepY = fontSize * 2.6;
      const stepX = fontSize * 6.2;
      ctx.translate(w / 2, h / 2);
      ctx.rotate(-24 * Math.PI / 180);
      for (let y = -h; y < h * 2; y += stepY) {
        for (let x = -w; x < w * 2; x += stepX) {
          ctx.fillText('MiniNous', x, y);
        }
      }
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#2C1F14';
      const big = Math.max(28, Math.round(w / 5.5));
      ctx.font = `800 ${big}px Quicksand, Montserrat, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.translate(w / 2, h / 2);
      ctx.rotate(-18 * Math.PI / 180);
      ctx.fillText('APERÇU', 0, 0);
      ctx.restore();
      setDisplaySrc(canvas.toDataURL('image/jpeg', 0.58));
      setFailed(false);
    };
    img.onerror = () => {
      if (!cancelled) { setFailed(true); setDisplaySrc(src); }
    };
    const loadUrl = (src.startsWith('http://') || src.startsWith('https://'))
      ? `/api/proxy-image?url=${encodeURIComponent(src)}`
      : src;
    img.src = loadUrl;
    return () => { cancelled = true; };
  }, [src]);

  if (!src) return null;
  if (!displaySrc && !failed) {
    return (
      <div style={{ ...style, minHeight: 220, display:'flex', alignItems:'center',
        justifyContent:'center', background:'var(--bark-pale)', borderRadius:20 }}>
        <span className="spin" style={{ width:32, height:32, border:'3px solid var(--bark-light)',
          borderTopColor:'var(--clay)', borderRadius:'50%', display:'inline-block' }}/>
      </div>
    );
  }
  return (
    <img src={displaySrc || src} alt={alt} style={style} draggable="false"/>
  );
}

function CounterRow({ label, value, min, max, onChange, hint }) {
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, marginBottom:10 }}>
      <div style={{ flex:1, minWidth:0 }}>

        {hint && <div style={{ fontSize:'.72rem', color:'var(--muted)', marginTop:2 }}>{hint}</div>}
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <button type="button" aria-label={`Moins ${label}`}
          onClick={() => onChange(value - 1)} disabled={value <= min}
          style={{ width:34, height:34, borderRadius:9, border:'1.5px solid var(--bark-light)',
            background:'var(--bark-pale)', fontSize:'1.1rem', fontWeight:700,
            cursor: value <= min ? 'not-allowed' : 'pointer', opacity: value <= min ? .4 : 1 }}>−</button>
        <span style={{ fontFamily:'Quicksand', fontWeight:700, fontSize:'1.2rem', minWidth:24, textAlign:'center' }}>{value}</span>
        <button type="button" aria-label={`Plus ${label}`}
          onClick={() => onChange(value + 1)} disabled={value >= max}
          style={{ width:34, height:34, borderRadius:9, border:'1.5px solid var(--bark-light)',
            background:'var(--bark-pale)', fontSize:'1.1rem', fontWeight:700,
            cursor: value >= max ? 'not-allowed' : 'pointer', opacity: value >= max ? .4 : 1 }}>+</button>
      </div>
    </div>
  );
}

function FamilyCompositionQuestion({ faceCount, childCount, max, recommendedMax, onChange, photoUrl, photoHeader }) {
  const total = Math.max(1, Math.min(max, Number(faceCount) || 2));
  const children = Math.max(0, Math.min(total, Number(childCount) || 0));
  const adults = total - children;
  const overRecommended = recommendedMax != null && total > recommendedMax;

  const setAdults = (na) => {
    const nextAdults = Math.max(0, Math.min(max - children, na));
    onChange({ faceCount: Math.max(1, nextAdults + children), childCount: children });
  };
  const setChildren = (nc) => {
    const nextChildren = Math.max(0, Math.min(max - adults, nc));
    onChange({ faceCount: Math.max(1, adults + nextChildren), childCount: nextChildren });
  };

  return (
    <div className="paywall-composition-card"
      style={{ background:'#fff', border:'1.5px solid var(--bark-light)', borderRadius:14, textAlign:'left' }}>
      {photoHeader && photoUrl && (
        <div className="paywall-card-photo-header">
          <PaywallPhotoOverlay photoUrl={photoUrl}/>
        </div>
      )}
      <div className="paywall-card-body">
        {photoUrl && !photoHeader && (
          <div className="paywall-photo-thumb" style={{ marginBottom:12 }}>
            <img src={photoUrl} alt=""/>
          </div>
        )}
          <p style={{ fontFamily:'Quicksand', fontWeight:600, fontSize:'.92rem',
            color:'var(--dark)', lineHeight:1.55, marginBottom:14 }}>
            Ajustez le nombre de personnages adultes et enfants présents dans votre image
          </p>
          <CounterRow label="Adultes" value={adults} min={children === 0 ? 1 : 0} max={max - children}
            onChange={setAdults}/>
          <CounterRow label="Enfants" value={children} min={0} max={max - adults}
            hint="Moins de 12 ans" onChange={setChildren}/>
          <div style={{ marginTop:12, padding:'10px 12px', background:'var(--bark-pale)', borderRadius:10,
            display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <span style={{ fontSize:'.82rem', color:'var(--muted)' }}>Total figurines</span>
            <span style={{ fontFamily:'Quicksand', fontWeight:700, fontSize:'1.15rem', color:'var(--clay)' }}>
              {total}
            </span>
          </div>
          {overRecommended && (
            <p style={{ fontSize:'.78rem', color:'var(--clay-deep)', marginTop:10, lineHeight:1.55 }}>
              Au-delà de {recommendedMax} personnages, plusieurs photos séparées sont recommandées pour la qualité du tracé.
            </p>
          )}
      </div>
    </div>
  );
}

function Paywall({ packDef, status, session, onPhotoUpload, onDemoPhoto, onFaceCountChange, onHome }) {
  const [busy, setBusy] = useState(false);

  const [customerEmail, setCustomerEmail] = useState('');

  useEffect(() => {
    window.scrollTo(0, 0);
  }, []);

    window.scrollTo(0, 0);
  }, [checkoutStep]);
  const soldOut = status && status.remaining <= 0;
  const maxFaces = status?.maxFaces ?? 8;

    : packDef?.faceCount;

  const tooManyFaces = quote && !quote.ok && quote.reason === 'too_many';
  const hasQuote = quote?.ok;
  const isSoloOffer = hasQuote && quote.isSolo;
  const showComposition = session?.enterVia === 'upload' && session?.photoBase64;
  const compositionFaceCount = session?.faceCount ?? session?.detectedFaces ?? 2;
  const overRecommended = showComposition && compositionFaceCount > maxFaces;
  const isPackOnly = session?.enterVia === 'pack' && !session?.photoBase64;
  const showcaseCount = session?.showcaseCount ?? session?.faceCount
    ?? (hasQuote ? quote.faceCount : packDef?.faceCount);
  const showcase = getShowcaseForCount(showcaseCount);
  const exampleCount = showcaseCount;
  const portEur = hasQuote ? Number(quote.shippingEur) || 0 : 0;
  const figurinesTtc = hasQuote ? quote.figurinesTtcEur : null;
  const deliveryLabel = fridayDelivery
    ? `Réception ${deliveryDates.friday}`
    : `Réception ${deliveryDates.tuesday}`;

  const totalTtc = hasQuote ? quote.totalEur : null;

  const goToDelivery = () => {
    if (!hasQuote || overRecommended || quoteLoading || !hasPersonalPhoto) return;
    setError(null);
    setCheckoutStep('delivery');

  const pay = async () => {
    if (!hasQuote || overRecommended || quoteLoading || !hasPersonalPhoto) return;

        photoBase64: session.photoBase64 || undefined,
        childCount: session.childCount ?? 0,
        fridayDelivery,
        shippingZone,
        newsletterOptIn,
        email: email || undefined,
      });

      setError(e.message);
      setBusy(false);

/* ─── APP SHELL ───────────────────────────────────────────────── */
function useOrientationFix() {
  const [, forceRender] = useState(0);
  useEffect(() => {
    const setVh = () => {
      document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    };
    const onResize = () => setVh();
    const onOrientation = () => {
      setTimeout(() => { setVh(); forceRender(n => n + 1); }, 120);
    };
    window.addEventListener('resize', onResize, { passive: true });
    window.addEventListener('orientationchange', onOrientation, { passive: true });
    setVh();
    return () => {
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onOrientation);
    };
  }, []);
}

function App() {
  useOrientationFix();
  const paywallPath = PAYWALL_PATH.replace(/\/$/, '');
  const [state, setState] = useState(() => (
    window.location.pathname.replace(/\/$/, '') === paywallPath ? 'pricing' : 'landing'
  ));
  const [selectedPack, setSelectedPack] = useState('famille');
  const [photoBusyUrl, setPhotoBusyUrl] = useState(null);
  const [session, setSession] = useState({
    enterVia: null,
    photoUrl: null,
    photoBase64: null,
    detectedFaces: null,
    faceBoxes: null,
    faceCount: null,
    childCount: 0,
    showcaseCount: null,
    isDemoExample: false,
    error: null,
    orderToken: null,
    orderStatusUrl: null,
  });
  const [tick, setTick] = useState(0);
  const { status } = useWeekStatus();
  const maxFaces = status?.maxFaces ?? 8;
  const packs = status?.packs ?? CATALOG_PACKS_FALLBACK;
  const packDef = getPackDef(selectedPack || 'famille', packs);

  const go = useCallback((next) => {
    setTick(t => t + 1);
    setState(next);
    const path = window.location.pathname.replace(/\/$/, '') || '/';
    if (next === 'pricing' && path !== paywallPath) {
      window.history.pushState({ mininous: 'pricing' }, '', paywallPath);
    } else if (next === 'landing' && path === paywallPath) {
      window.history.pushState({ mininous: 'landing' }, '', '/');
    }
    window.scrollTo(0, 0);
  }, [paywallPath]);

  useEffect(() => {
    const onPopState = () => {
      const onPaywall = window.location.pathname.replace(/\/$/, '') === paywallPath;
      setState(onPaywall ? 'pricing' : 'landing');
      setTick(t => t + 1);
      window.scrollTo(0, 0);
    };
    window.addEventListener('popstate', onPopState);
    return () => window.removeEventListener('popstate', onPopState);
  }, [paywallPath]);

  const startPackRoute = useCallback((packId) => {
    const p = packs.find(x => x.id === packId) || CATALOG_PACKS_FALLBACK.find(x => x.id === packId);
    setSelectedPack(packId);
    setSession({
      enterVia: 'pack',
      photoUrl: null,
      photoBase64: null,
      detectedFaces: null,
      faceBoxes: null,
      faceCount: null,
      childCount: 0,
      showcaseCount: p?.faceCount ?? null,
      isDemoExample: false,
      error: null,
      orderToken: null,
      orderStatusUrl: null,
    });
    go('pricing');
  }, [go, packs]);

  const goHome = useCallback(() => {
    setSelectedPack('famille');
    setSession({
      enterVia: null,
      photoUrl: null,
      photoBase64: null,
      detectedFaces: null,
      faceBoxes: null,
      faceCount: null,
      childCount: 0,
      showcaseCount: null,
      isDemoExample: false,
      error: null,
      orderToken: null,
      orderStatusUrl: null,
    });
    go('landing');
  }, [go]);

  const beginDemoFlow = useCallback((demoPreset) => {
    if (!demoPreset) return;
    setPhotoBusyUrl(demoPreset.src);
    setSelectedPack('famille');
    setSession({
      enterVia: 'demo',
      photoUrl: demoPreset.src,
      photoBase64: null,
      detectedFaces: null,
      faceBoxes: null,
      faceCount: demoPreset.faceCount,
      childCount: demoPreset.childCount ?? 0,
      showcaseCount: demoPreset.showcaseCount ?? demoPreset.faceCount,
      isDemoExample: true,
      error: null,
      orderToken: null,
      orderStatusUrl: null,
    });
    setTick(t => t + 1);
    go('pricing');
    requestAnimationFrame(() => requestAnimationFrame(() => setPhotoBusyUrl(null)));
  }, [go]);

  const beginPhotoFlow = useCallback(async (file, { enterVia = 'upload', demoPreset = null } = {}) => {
    setPhotoBusyUrl(demoPreset?.src || IMG.upload);
    try {
      const preset = demoPreset || presetFromFileName(file.name);
      const { photoUrl, photoBase64 } = await readImageFile(file);
      setPhotoBusyUrl(photoUrl);
      let detectedFaces = null;
      let faceBoxes = null;
      let initialCount = 2;
      let initialChildren = 0;

      if (preset) {
        initialCount = preset.faceCount;
        initialChildren = preset.childCount ?? 0;
      } else {
        try {
          const detected = await detectFaces(photoBase64);
          if (detected.count > 0) {
            detectedFaces = detected.count;
            faceBoxes = detected.boxes;
            initialCount = Math.min(maxFaces, detected.count);
          } else if (detected.boxes.length > 0) {
            faceBoxes = detected.boxes;
          }
        } catch { /* fallback */ }
      }

      const showcaseCount = preset?.showcaseCount ?? initialCount;

      let orderToken = null;
      let orderStatusUrl = null;
      try {
        const draft = await startOrderDraft({
          faceCount: initialCount,
          childCount: initialChildren,
          photoBase64,
        });
        orderToken = draft.accessToken;
        orderStatusUrl = draft.links?.status ?? null;
        if (!draft.sourcePhotoUrl) {
          console.warn('[order-start] pas de sourcePhotoUrl dans la réponse');
        }
      } catch (err) {
        console.warn('[order-start]', err);
        setPhotoBusyUrl(null);
        alert('La photo n\'a pas pu être enregistrée sur le serveur. Réessayez ou vérifiez votre connexion avant de payer.');
        return;
      }

      setSelectedPack('famille');
      setSession({
        enterVia,
        photoUrl,
        photoBase64,
        detectedFaces,
        faceBoxes,
        faceCount: initialCount,
        childCount: initialChildren,
        showcaseCount,
        isDemoExample: false,
        error: null,
        orderToken,
        orderStatusUrl,
      });
      setTick(t => t + 1);
      go('pricing');
      requestAnimationFrame(() => requestAnimationFrame(() => setPhotoBusyUrl(null)));
    } catch {
      setPhotoBusyUrl(null);
      alert('Impossible de lire cette image. Essayez un autre fichier.');
    }
  }, [go, maxFaces]);

  const onPhotoUpload = useCallback((file) => (
    beginPhotoFlow(file, { enterVia: 'upload' })
  ), [beginPhotoFlow]);

  const onPaywallPhotoUpload = useCallback((file) => (
    beginPhotoFlow(file, { enterVia: 'upload' })
  ), [beginPhotoFlow]);

  const onDemoPhoto = useCallback((demo) => {
    beginDemoFlow(demo);
  }, [beginDemoFlow]);

  const onFaceCountChange = useCallback(({ faceCount, childCount }) => {
    const n = Math.max(1, Math.min(FACE_COUNTER_MAX, faceCount));
    const kids = Math.max(0, Math.min(n, childCount ?? 0));
    setSession(s => {
      if (s.orderToken) {
        patchOrderDraft({ accessToken: s.orderToken, faceCount: n, childCount: kids }).catch(() => {});
      }
      return {
        ...s,
        faceCount: n,
        childCount: kids,
        showcaseCount: n,
        error: null,
      };
    });
  }, []);

  const screens = {
    landing:    <Landing onPackExample={startPackRoute} onPhotoUpload={onPhotoUpload}
                  onDemoPhoto={onDemoPhoto} onHome={goHome} />,
    pricing:    <Paywall packDef={packDef} status={status} session={session}
                  onPhotoUpload={onPaywallPhotoUpload} onDemoPhoto={onDemoPhoto}
                  onFaceCountChange={onFaceCountChange} onHome={goHome} />,
    editor:     <Editor go={go} onHome={goHome}/>,
    success:    <Success/>,
  };

  return (
    <>
      <PhotoFlowOverlay photoUrl={photoBusyUrl}/>
      <div key={tick}>
        {screens[state]}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
